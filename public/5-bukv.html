<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>5 букв — dvoeplay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1C1E'/%3E%3Crect x='8' y='23' width='14' height='18' rx='4' fill='%23E7362B'/%3E%3Crect x='25' y='23' width='14' height='18' rx='4' fill='%23F5BE0A'/%3E%3Crect x='42' y='23' width='14' height='18' rx='4' fill='%23E7362B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --well:#E8E8ED;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);
  --tint:#007AFF;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --grn-a:#4CD671; --grn-b:#30B855;
  --abs:#8A8D93; --on-yel:#1C1C1E;
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.14);
  --pc-shadow:0 2px 6px rgba(0,0,0,.20);
  --spring:cubic-bezier(.34,1.48,.5,1);
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --abs:#4B4B4D;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --pc-shadow:0 3px 9px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--label);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- каркас из двух экранов ---------- */
.app{position:fixed;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 10px);
  transition:transform .46s var(--ease),opacity .46s var(--ease);
  background:var(--bg);
  will-change:transform;
}
#game{transform:translateX(100%)}
.app.playing #menu{transform:translateX(-28%);opacity:.35}
.app.playing #game{transform:translateX(0)}

/* ---------- навигация ---------- */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:10px}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.35px;text-align:center}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;
  border:0;background:none;color:var(--tint);cursor:pointer;
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:6px 8px 6px 0;transition:opacity .15s ease;
}
.back:active{opacity:.4}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon{
  justify-self:end;width:34px;height:34px;border:0;border-radius:50%;
  background:var(--fill);color:var(--tint);display:grid;place-items:center;cursor:pointer;
  transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.brand{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.mini{
  position:relative;width:min(62%,216px);aspect-ratio:5/2;
  background:var(--surface);border-radius:18px;overflow:hidden;
  box-shadow:var(--card-shadow);margin-bottom:30px;
}
.mgrid{position:absolute;inset:14px;display:flex;gap:6px;perspective:400px}
.mtile{
  flex:1;border-radius:8px;background:var(--well);
  display:flex;align-items:center;justify-content:center;
  font:700 20px/1 -apple-system,system-ui,sans-serif;color:var(--label);
  opacity:0;transform:scale(.5);
  transition:opacity .25s ease,transform .3s var(--spring),background .2s ease,color .2s ease;
}
.mtile.show{opacity:1;transform:scale(1)}
.mtile.correct{background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.mtile.present{background:linear-gradient(180deg,var(--yel-a),var(--yel-b));color:var(--on-yel)}
.mtile.absent{background:var(--abs);color:#fff}

.wordmark{margin:0;font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--label)}
.wordmark .o{
  display:inline-block;width:.6em;height:.6em;border-radius:50%;
  vertical-align:-.045em;margin:0 .015em;
  background:linear-gradient(90deg,var(--red-b) 0 50%,var(--yel-b) 50% 100%);
}
.tagline{margin:9px 0 0;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- счёт (только режим «Вдвоём») ---------- */
.scoreboard{position:relative;display:none;background:var(--fill);border-radius:16px;padding:4px;margin-bottom:10px}
#game.duo .scoreboard{display:flex}
.slider{
  position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
  background:var(--surface);border-radius:12px;box-shadow:var(--thumb-shadow);
  transition:transform .42s var(--spring),opacity .3s ease;
}
.side{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px}
.side .name{font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.05px;display:flex;align-items:center;gap:5px}
.side .name::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.side[data-p="2"] .name::before{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.side .score{font-size:24px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.12;transition:transform .3s var(--spring)}
.side.bump .score{transform:scale(1.22)}
.side .cap{font-size:11px;color:var(--label3);letter-spacing:0}

/* ---------- игровая зона: сетка слов ---------- */
/* justify-content:center нельзя: когда сетка не влезает (низкий альбомный экран),
   центрирование срезает её сверху и доскроллить до первой строки невозможно.
   margin:auto центрирует, пока есть место, и схлопывается в 0 при переполнении. */
.arena{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden}
.wgrid{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:auto}
.wrow{display:flex;gap:8px;justify-content:center}
.wrow.shake{animation:rowshake .4s ease}
@keyframes rowshake{
  10%,90%{transform:translateX(-6px)} 20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}
}
.tile{
  width:var(--tile,56px);height:var(--tile,56px);
  border:2px solid var(--sep);border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font:700 calc(var(--tile,56px) * .42)/1 -apple-system,system-ui,sans-serif;
  color:var(--label);text-transform:uppercase;
  transition:border-color .15s ease,width .2s ease,height .2s ease;
}
.tile.filled{border-color:var(--label3)}
.tile.turn1{border-color:var(--red-b)}
.tile.turn2{border-color:var(--yel-b)}
.tile.pop{animation:tilepop .15s var(--spring)}
@keyframes tilepop{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.tile.flip{animation:tileflip .5s ease}
@keyframes tileflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.correct{border-color:transparent;background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.tile.present{border-color:transparent;background:linear-gradient(180deg,var(--yel-a),var(--yel-b));color:var(--on-yel)}
.tile.absent{border-color:transparent;background:var(--abs);color:#fff}
.tile.bounce{animation:tilebounce .5s var(--spring)}
@keyframes tilebounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}

.hint{
  flex:none;text-align:center;font-size:13px;color:var(--label2);letter-spacing:-.05px;
  min-height:18px;margin:8px 0 2px;transition:color .18s ease;
}

/* ---------- подсказка-пузырь у сетки ---------- */
/* Висит абсолютно внутри .arena, координаты и положение хвостика задаёт JS:
   left — сам пузырь (прижат к краю поля, если у края), --tip-arrow — хвостик,
   который целится точно в нужную плитку. Хвостик смотрит вверх, а у нижних
   строк вниз (класс flip). Поэтому здесь никакого translateX по центру нет —
   иначе он бы дрался с посчитанным left. */
.tip{
  position:absolute;left:0;top:0;z-index:3;
  max-width:min(268px,94%);
  background:var(--surface);color:var(--label);
  border:1px solid var(--sep);border-radius:14px;
  box-shadow:var(--card-shadow);
  padding:10px 14px;
  font:500 14px/1.35 -apple-system,system-ui,sans-serif;letter-spacing:-.15px;
  text-align:center;
  opacity:0;pointer-events:none;
  transform:translateY(-5px);
  transition:opacity .2s ease,transform .3s var(--spring);
}
.tip.on{opacity:1;transform:translateY(0)}
.tip.flip{transform:translateY(5px)}
.tip.flip.on{transform:translateY(0)}
.tip::after{
  content:"";position:absolute;left:var(--tip-arrow,50%);margin-left:-7px;top:-8px;
  width:14px;height:14px;background:var(--surface);
  border:1px solid var(--sep);border-right:0;border-bottom:0;
  border-radius:3px 0 0 0;transform:rotate(45deg);
}
.tip.flip::after{top:auto;bottom:-8px;transform:rotate(225deg)}

/* ---------- экранная клавиатура ---------- */
.kbd{--kgap:4px;flex:none;display:flex;flex-direction:column;gap:8px;max-width:480px;width:100%;margin:0 auto;padding:2px 0 calc(env(safe-area-inset-bottom) + 4px)}
.krow{display:flex;gap:var(--kgap);justify-content:center}
/* В среднем ряду на одну клавишу меньше. Сдвигаем его ровно на полклавиши с каждой
   стороны — тогда во всех рядах клавиши одной ширины, как на системной ЙЦУКЕН,
   а не разъезжаются. Полклавиши верхнего ряда = (ширина ряда + зазор) / 24. */
.krow.mid{padding:0 calc((100% + var(--kgap)) / 24)}
/* padding:0 обязателен. У кнопки свой отступ от браузера (по 6px по бокам), а при
   box-sizing:border-box он работает нижней границей для flex-basis: клавиши перестают
   делить ряд по заданным пропорциям и буквы в нижнем ряду становятся шире остальных.
   Рамка работает так же, но она одинакова у всех клавиш и в расчёте сокращается.
   Клавиша — контур на фоне страницы, как плитка поля: так буква читается крупнее,
   чем на серой заливке. Буквы показываем заглавными (data-k остаётся строчным). */
.key{
  flex:1;min-width:0;height:48px;padding:0;
  border:1.5px solid var(--sep);border-radius:8px;
  background:var(--bg);color:var(--label);
  font:600 18px/1 -apple-system,system-ui,sans-serif;letter-spacing:0;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:transform .1s var(--spring),background .2s ease,color .2s ease,border-color .2s ease;
}
.key:active{transform:scale(.88);background:var(--fill2)}
.key.wide{flex:1.6}
.key svg{width:21px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.key.enter{background:var(--tint);border-color:var(--tint);color:#fff}
.key.enter svg{width:24px;height:20px;stroke-width:2.9}
.key.correct{border-color:transparent;background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.key.present{border-color:transparent;background:linear-gradient(180deg,var(--yel-a),var(--yel-b));color:var(--on-yel)}
.key.absent{border-color:transparent;background:var(--abs);color:#fff}

/* ---------- итоговая шторка ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .38s var(--ease);z-index:5}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(102%);transition:transform .5s var(--ease);
  max-width:520px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
.medal{
  position:relative;width:56px;height:56px;border-radius:50%;margin:2px auto 14px;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a),var(--b));
  box-shadow:var(--pc-shadow),inset 0 -3px 6px rgba(0,0,0,.2);
}
.medal::after{
  content:"";position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a2),var(--b2));
  box-shadow:0 0 0 2px var(--surface);
}
.medal.tie{--a:var(--fill);--b:var(--fill);--a2:var(--label3);--b2:var(--label3);box-shadow:none}
.sheet.on .medal{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:-.45px}
.sheet p{margin:5px 0 22px;text-align:center;font-size:15px;color:var(--label2);letter-spacing:-.1px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;
  color:inherit;font:inherit;cursor:pointer;transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die{transform:rotate(90deg)}
.primary{
  width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;
  font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:16px;cursor:pointer;transition:transform .18s var(--spring),opacity .15s ease;
}
.primary:active{transform:scale(.98);opacity:.85}
.ghost-btn{
  width:100%;border:0;background:none;color:var(--tint);
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:15px;margin-top:2px;cursor:pointer;transition:opacity .15s ease;
}
.ghost-btn:active{opacity:.45}
.pill{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);
  z-index:4;border:0;border-radius:22px;background:var(--tint);color:#fff;
  font:600 15px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:13px 20px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;transition-duration:.06s!important}
}
@media (orientation:landscape) and (max-height:560px){
  .nav{height:36px;margin-bottom:4px}
  .scoreboard{margin-bottom:6px}
  .side{padding:4px 4px 5px}
  .side .name{font-size:11px}
  .side .score{font-size:17px}
  .side .cap{font-size:9px}
  .hint{margin:4px 0 1px;min-height:14px;font-size:12px}
  .tip{font-size:13px;padding:8px 12px;border-radius:12px}
  .key{height:36px;font-size:15px}
  .kbd{gap:4px}
  .wgrid{gap:5px}
  .wrow{gap:5px}
}
@media (orientation:landscape) and (max-height:420px){
  .nav{height:30px}
  .key{height:30px;font-size:13px}
  .kbd{gap:3px}
  .hint{display:none}
}
@media (max-height:660px){
  .wordmark{font-size:34px}
  .mini{margin-bottom:22px}
  .footnote{margin-top:10px}
  .legal{margin-top:7px}
  .side .score{font-size:21px}
  .row{padding:11px 16px}
  .key{height:42px;font-size:16px}
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ================= МЕНЮ ================= -->
  <section class="screen" id="menu">
    <a class="tohub" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все игры</a>
    <div class="brand">
      <div class="mini" id="mini" aria-hidden="true">
        <div class="mgrid" id="mgrid">
          <div class="mtile"></div><div class="mtile"></div><div class="mtile"></div><div class="mtile"></div><div class="mtile"></div>
        </div>
      </div>
      <h1 class="wordmark">dv<span class="o"></span>eplay</h1>
      <p class="tagline">Игры для двоих</p>
      <p class="footnote">Зелёный — буква на месте, жёлтый — есть в слове, серый — мимо</p>
    </div>

    <h2 class="section">5 букв</h2>
    <div class="list">
      <button class="row" data-mode="0">

<script>
(function(){
"use strict";

/* ===================== ПРАВИЛА =====================
   Загадано слово из 5 букв. За одну попытку вводится слово той же длины;
   после ввода буквы подсвечиваются: зелёный — буква на своём месте,
   жёлтый — буква есть в слове, но не на этом месте, серый — такой буквы нет.
   Лёгко/Сложно — слово загадывается из общего словаря (сложный вариант —
   только слова с повторяющейся буквой), у игрока 6 или 5 попыток.
   Вдвоём — слово одно на двоих, игроки по очереди вводят по одной догадке
   в общее поле; выигрывает тот, кто первым назовёт слово целиком.
==================================================== */

/* Загадываемые слова — только существительные. Проверка вводимых игроком
   слов идёт по отдельному большому словарю VALID в конце файла. */
var WORDS=[
"народ","слово","книга","время","земля","город","рынок","песня","школа","семья",
"охота","игрок","облик","отдых","театр","поезд","драма","норма","форма","сумма",

"закон","домик","кухня","ванна","стена","забор","сарай","масло","сахар","перец",
"салат","пицца","сироп","лимон","груша","слива","вишня","чашка","ложка","вилка",
"плита","миска","банка","полка","диван","лампа","свеча","ковер","штора","шапка",
"кофта","брюки","туфля","сумка","замок","кошка","мышка","белка","олень","галка",
"индюк","рыбка","акула","пчела","зебра","панда","сокол","филин","ворон","актер",
"певец","пилот","моряк","купец","вождь","барон","принц","гость","сосед","вдова",
"юноша","малыш","толпа","разум","страх","слезы","обида","злоба","добро","тайна",
"ответ","успех","удача","конец","финал","старт","финиш","кубок","гонка","забег",
"атака","сотня","сутки","вечер","месяц","эпоха","сезон","гроза","дождь","ветер",
"мороз","отлив","степь","тайга","скала","радио","экран","почта","логин","вирус",
"робот","завод","насос","мотор","парта","доска","ручка","ранец","буква","фраза",
"текст","автор","герой","сюжет","балет","опера","гамма","рифма","поэма","проза",
"пьеса","роман","шашки","ферзь","ладья","пешка","раунд","дзюдо","палец","бровь",
"висок","пятка","мышца","жених","родня","аллея","бухта","залив","обрыв","амбар",
"собор","башня","шпиль","фасад","гараж","склад","вагон","такси","катер","паром",
"багаж","салон","омлет","сырок","горох","редис","тыква","арбуз","манго","банан",
"халва","вафля","блины","хомяк","хорек","ягуар","гиена","шакал","бизон","ослик",
"жираф","цапля","чайка","дятел","окунь","шмель","комар","сосна","дубок","ольха",
"астра","лилия","лопух","камыш","ткань","нитка","пряжа","шуруп","топор","дрель",
"клещи","кисть","холст","рамка","багет","ведро","метла","губка","скука","покой",
"честь","нужда","отказ","совет","намек","образ","доход","налог","вклад","товар",
"канун","закат","будни","досуг","смена","судья","сетка","шайба","лидер","труба",
"рояль","орган","танец","вальс","афиша","домен","релиз","макет"
];
function hasRepeat(w){
  var seen={},i,c;
  for(i=0;i<w.length;i++){ c=w[i]; if(seen[c]) return true; seen[c]=true; }
  return false;
}
var EASY=WORDS.filter(function(w){ return !hasRepeat(w); });
var HARD=WORDS.filter(hasRepeat);
var ROWS=[6,5,6,6];      /* 0 — легко, 1 — сложно, 2 — вдвоём, 3 — по сети */
var RANK={absent:1,present:2,correct:3};
var ALPHABET="абвгдежзийклмнопрстуфхцчшщъыьэюя";

function evaluate(guess,secret){
  var n=secret.length, res=[], freq={}, i;
  for(i=0;i<n;i++) res.push('absent');
  for(i=0;i<n;i++) freq[secret[i]]=(freq[secret[i]]||0)+1;
  for(i=0;i<n;i++){ if(guess[i]===secret[i]){ res[i]='correct'; freq[guess[i]]--; } }
  for(i=0;i<n;i++){ if(res[i]==='correct') continue; if(freq[guess[i]]>0){ res[i]='present'; freq[guess[i]]--; } }
  return res;
}

var app=document.getElementById('app');
var gameEl=document.getElementById('game');
var arenaEl=document.getElementById('arena');
var gridEl=document.getElementById('grid');
var kbdEl=document.getElementById('kbd');
var hintEl=document.getElementById('hint');
var tipEl=document.getElementById('tip');
var liveEl=document.getElementById('live');
var sliderEl=document.getElementById('slider');
var sheetEl=document.getElementById('sheet');
var backdrop=document.getElementById('backdrop');
var pillEl=document.getElementById('pill');
var mgridEl=document.getElementById('mgrid');

var mode=0, secret='', lastSecret='';
var net={seat:1,round:0};
var plies=0;             /* сколько попыток сделано за раунд — по этому net.js догоняет */
var rowEls=[], tileEls=[];
var curRow=0, curGuess=[];
var keyState={};
var over=false, locked=false, session=0;
var turn=1, starter=1, attemptsUsed={1:0,2:0};
/* вдвоём — это и «на одном телефоне», и «по сети»: поле и счёт одинаковые */
/* ---------- имена игроков ---------- */
/* Своё имя и имя друга лежат в общей памяти приложения, имя сетевого
   соперника приходит из комнаты. Пусто — показываем как раньше. */
function who(){
  var p=DP.names();
  if(mode===3){
    var me=p.me||'Вы', them=NET.oppName||'Соперник';
    return net.seat===2?[them,me]:[me,them];
  }
  if(mode===2) return [p.me||'Красные', p.friend||'Жёлтые'];
  return [p.me||'Вы','Соперник'];
}
/* настоящее ли имя у стороны — от этого зависит, как назвать победителя */
function named(i){
  var p=DP.names();
  if(mode===3) return i===net.seat ? !!p.me : !!NET.oppName;
  if(mode===2) return i===1 ? !!p.me : !!p.friend;
  return false;
}
function duo(){ return mode>=2; }
function notMine(){ return mode===3 && turn!==net.seat; }
var wins=[0,0,0], solved=0, played=0;

/* ===================== ВСПОМОГАТЕЛЬНОЕ ===================== */
function haptic(v,kind){ FX.fire(v,kind); }
function pickSecret(pool){
  /* по сети слово выбирается общим генератором комнаты — оно должно совпасть */
  if(mode===3 && NET.rng) return pool[(NET.rng()*pool.length)|0];
  var w;
  do{ w=pool[(Math.random()*pool.length)|0]; }while(w===lastSecret && pool.length>1);
  lastSecret=w;
  return w;
}
function wordForm(n){ return ["букв","буква","буквы","буквы","буквы","букв"][n]; }

/* ===================== СЕТКА ===================== */
function buildGrid(rows){
  gridEl.innerHTML=''; rowEls=[]; tileEls=[];
  for(var r=0;r<rows;r++){
    var rowEl=document.createElement('div');
    rowEl.className='wrow';
    var tiles=[];
    for(var c=0;c<5;c++){
      var t=document.createElement('div');
      t.className='tile';
      rowEl.appendChild(t);
      tiles.push(t);
    }
    gridEl.appendChild(rowEl);
    rowEls.push(rowEl);
    tileEls.push(tiles);
  }
}
function fit(){
  var r=arenaEl.getBoundingClientRect();
  if(!r.width||!r.height) return;
  var cols=5, rows=ROWS[mode];
  var cs=getComputedStyle(gridEl);
  var gap=parseFloat(cs.rowGap||cs.gap)||8;
  var wTile=(Math.min(r.width,360)-(cols-1)*gap-4)/cols;
  var hTile=(r.height-(rows-1)*gap-4)/rows;
  var t=Math.max(24,Math.min(60,wTile,hTile));
  gridEl.style.setProperty('--tile', t+'px');
}

/* ===================== КЛАВИАТУРА ===================== */
function upgradeKey(letter,state){
  var cur=keyState[letter];
  if(!cur||RANK[state]>RANK[cur]) keyState[letter]=state;
}
function renderKeyboard(){
  var keys=kbdEl.querySelectorAll('.key[data-k]');
  for(var i=0;i<keys.length;i++){
    var letter=keys[i].getAttribute('data-k');
    var st=keyState[letter];
    keys[i].classList.remove('correct','present','absent');
    if(st) keys[i].classList.add(st);
  }
}
function resetKeyboard(){ keyState={}; renderKeyboard(); }

/* ===================== ВВОД ===================== */
function onLetter(ch){
  if(over||locked||notMine()) return;
  if(curGuess.length>=5) return;
  hideTip();
  curGuess.push(ch);
  var idx=curGuess.length-1;
  var tile=tileEls[curRow][idx];
  tile.textContent=ch;
  tile.classList.add('filled','pop');
  setTimeout(function(){ tile.classList.remove('pop'); },150);
  haptic(4);
}
function onBack(){
  if(over||locked||notMine()) return;
  if(!curGuess.length) return;
  hideTip();
  var idx=curGuess.length-1;
  tileEls[curRow][idx].textContent='';
  tileEls[curRow][idx].classList.remove('filled');
  curGuess.pop();
  haptic(4);
}
function shakeRow(){
  var row=rowEls[curRow];
  row.classList.add('shake');
  setTimeout(function(){ row.classList.remove('shake'); },400);
}
/* ===================== ПОДСКАЗКИ ИГРОКУ =====================
   Пузырь наводится на конкретную строку сетки. Показываем его под строкой,
   а у двух нижних строк — над ней, чтобы не вылезал за край поля.
   Текст дублируем в aria-live: сам пузырь скрыт от скринридера, иначе
   сообщение прочитается дважды. */
var tipTimer=null;
/* colIdx — номер буквы, к которой относится подсказка. Если он задан, хвостик
   целится точно в эту плитку; если нет — в середину строки. Сам пузырь ставим
   по центру цели, но не даём вылезти за края поля, поэтому у крайних букв он
   сдвигается, а хвостик остаётся на букве. Все offset* меряются от .arena —
   она position:relative, и промежуточные .wgrid/.wrow не позиционированы. */
function showTip(msg,rowIdx,ms,colIdx){
  var idx=(rowIdx==null)?curRow:rowIdx;
  var row=rowEls[idx];
  if(!row) return;
  tipEl.textContent=msg;
  liveEl.textContent=msg;
  var flip=idx>=rowEls.length-2;
  tipEl.classList.toggle('flip',flip);

  var tile=(colIdx!=null && tileEls[idx]) ? tileEls[idx][colIdx] : null;
  var target=tile ? tile.offsetLeft+tile.offsetWidth/2
                  : row.offsetLeft+row.offsetWidth/2;

  var w=tipEl.offsetWidth, h=tipEl.offsetHeight, edge=8;
  var maxLeft=Math.max(edge,arenaEl.clientWidth-w-edge);
  var left=Math.max(edge,Math.min(target-w/2,maxLeft));
  tipEl.style.left=left+'px';
  tipEl.style.setProperty('--tip-arrow',Math.max(14,Math.min(target-left,w-14))+'px');
  tipEl.style.top=(flip ? row.offsetTop-h-10 : row.offsetTop+row.offsetHeight+10)+'px';
  tipEl.classList.add('on');
  clearTimeout(tipTimer);
  tipTimer=setTimeout(hideTip,ms||2800);
}
function hideTip(){ clearTimeout(tipTimer); tipEl.classList.remove('on'); }

/* Что игрок уже видел. Флаги переживают перезапуск, если хранилище доступно;
   если нет (приватный режим, ограничения) — подсказки просто покажутся один
   раз за сеанс, игра от этого не зависит. */
var TIPS_KEY='dvoeplay.5bukv.tips';
var tipsSeen={start:0,correct:0,present:0,absent:0};
try{
  var savedTips=JSON.parse(localStorage.getItem(TIPS_KEY)||'{}');
  for(var tk in tipsSeen) if(savedTips[tk]) tipsSeen[tk]=1;
}catch(e){}
function markTip(k){
  tipsSeen[k]=1;
  try{ localStorage.setItem(TIPS_KEY,JSON.stringify(tipsSeen)); }catch(e){}
}
/* Объясняем цвет ровно тогда, когда игрок впервые его увидел, и не больше
   одного объяснения за попытку — иначе после первого же слова прилетело бы
   три подсказки подряд. */
var COLOR_TIPS=[
  ['correct','Зелёная — буква стоит на своём месте'],
  ['present','Жёлтая — буква есть в слове, но в другом месте'],
  ['absent','Серая — такой буквы в слове нет']
];
function teachColors(fb){
  var firstAt={},i;
  for(i=0;i<fb.length;i++) if(firstAt[fb[i]]==null) firstAt[fb[i]]=i;
  for(i=0;i<COLOR_TIPS.length;i++){
    var k=COLOR_TIPS[i][0];
    if(firstAt[k]!=null && !tipsSeen[k]){
      markTip(k);
      showTip(COLOR_TIPS[i][1],curRow,3600,firstAt[k]);
      return;
    }
  }
}
function describeGuess(fb){
  var c=0,p=0,i;
  for(i=0;i<fb.length;i++){ if(fb[i]==='correct') c++; else if(fb[i]==='present') p++; }
  var s='Попытка '+(curRow+1)+': '+c+' '+wordForm(c)+' на месте';
  if(p) s+=', '+p+' '+wordForm(p)+' в слове';
  return s+'.';
}

function onEnter(){
  if(over||locked||notMine()) return;
  if(curGuess.length<5){ shakeRow(); showTip('Нужно пять букв',curRow); haptic(10,'error'); return; }
  var g=curGuess.join('');
  if(!isWord(g)){
    shakeRow();
    showTip('Такого слова нет в словаре',curRow,3200);
    haptic(10,'error');
    return;
  }
  submitGuess();
  if(mode===3) NET.send(g,3-net.seat);   /* попытки строго по очереди */
}

/* попытка соперника: дорисовываем буквы в строку и судим как свою */
function applyGuess(w){
  if(over) return;
  w=String(w||'').toLowerCase();
  if(w.length!==5 || !tileEls[curRow]) return;
  curGuess=w.split('');
  for(var i=0;i<5;i++){
    var t=tileEls[curRow][i];
    if(!t) continue;
    t.textContent=w[i];
    t.classList.add('filled');
  }
  submitGuess();
}
function submitGuess(){
  locked=true; plies++;
  var s=session;
  var guessStr=curGuess.join('');
  var fb=evaluate(guessStr,secret);
  var tiles=tileEls[curRow];
  var i;
  for(i=0;i<5;i++){
    (function(idx){
      setTimeout(function(){
        if(s!==session) return;
        tiles[idx].classList.add('flip');
        setTimeout(function(){
          if(s!==session) return;
          tiles[idx].classList.remove('filled');
          tiles[idx].classList.add(fb[idx]);
        },250);
      },idx*260);
    })(i);
  }
  var totalDelay=4*260+560;
  setTimeout(function(){
    if(s!==session) return;
    for(i=0;i<5;i++) upgradeKey(guessStr[i],fb[i]);
    renderKeyboard();
    liveEl.textContent=describeGuess(fb);
    var winnerSide=duo()?turn:1;
    var win=guessStr===secret;
    if(duo()){ attemptsUsed[turn]++; paintScoreboard(); }
    if(win){
      for(i=0;i<5;i++){
        (function(idx){ setTimeout(function(){ if(s===session) tiles[idx].classList.add('bounce'); },idx*80); })(i);
      }
      haptic([14,60,26]);
      setTimeout(function(){ if(s===session) finishRound(winnerSide,s); },700);
      return;
    }
    if(curRow+1<ROWS[mode]) teachColors(fb);
    curRow++; curGuess=[];
    if(curRow>=ROWS[mode]){
      haptic(12,'error');
      setTimeout(function(){ if(s===session) finishRound(0,s); },400);
      return;
    }
    if(duo()){ turn=3-turn; }
    locked=false;
    paintTurnRow();
    paintHint();
    if(mode===3) liveEl.textContent+=turn===net.seat?' Ваш ход.':' Ход соперника.';
    else if(mode===2) liveEl.textContent+=' Ход '+(turn===1?'красных':'жёлтых')+'.';
  },totalDelay);
}

function paintTurnRow(){
  for(var i=0;i<tileEls.length;i++){
    for(var j=0;j<tileEls[i].length;j++) tileEls[i][j].classList.remove('turn1','turn2');
  }
  if(duo() && !over && tileEls[curRow]){
    var cls='turn'+turn;
    for(var j=0;j<tileEls[curRow].length;j++) tileEls[curRow][j].classList.add(cls);
  }
  keepRowVisible();
}
/* Держим активную строку в поле зрения на очень низких экранах.
   Важно: двигаем ТОЛЬКО .arena и только по вертикали. Раньше здесь стоял
   row.scrollIntoView(), и это ломало вход в игру на телефоне: функция
   вызывается в тот момент, когда экран игры ещё сдвинут на translateX(100%),
   то есть строка физически находится за правым краем экрана — браузер честно
   прокручивал к ней всю страницу, весь интерфейс уезжал влево и потом
   отскакивал назад. */
function keepRowVisible(){
  var row=rowEls[curRow];
  if(!row) return;
  if(arenaEl.scrollHeight<=arenaEl.clientHeight) return;
  var a=arenaEl.getBoundingClientRect(), r=row.getBoundingClientRect();
  if(r.top<a.top) arenaEl.scrollTop-=(a.top-r.top)+4;
  else if(r.bottom>a.bottom) arenaEl.scrollTop+=(r.bottom-a.bottom)+4;
}
function paintScoreboard(){
  if(!duo()) return;
  var n=who();
  document.getElementById('name1').textContent=n[0];
  document.getElementById('name2').textContent=n[1];
  sliderEl.style.transform='translateX('+(turn===1?0:100)+'%)';
  document.getElementById('score1').textContent=attemptsUsed[1];
  document.getElementById('score2').textContent=attemptsUsed[2];
}
function paintHint(){
  if(over){ return; }
  if(mode===3) hintEl.textContent=turn===net.seat?'Ваш ход — введите слово':'Ход соперника';
  else if(mode===2) hintEl.textContent='Ход '+(turn===1?'красных':'жёлтых')+' — введите слово';
  else hintEl.textContent='Попытка '+(curRow+1)+' из '+ROWS[mode];
}

/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g; write(d);
  }
  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  return {read:read,save:save,sound:sound,names:names};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();


function openSheet(outcomeSide){
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('5-bukv',{win:duo()?(outcomeSide||0):0, solved:(!duo()&&outcomeSide)?1:0,
    mode:duo()?2:mode,
    note:duo()?((mode===3?'По сети · ':'')+'Счёт '+wins[1]+' : '+wins[2]):('Решено '+solved+' из '+played)});

      m.className='medal tie';

      titleEl.textContent = mode===3
        ? (outcomeSide===net.seat ? 'Вы угадали'
           : (named(outcomeSide) ? 'Угадал(а) '+who()[outcomeSide-1] : 'Угадал соперник'))
        : (named(outcomeSide) ? 'Победа: '+who()[outcomeSide-1]
           : 'Победили '+(outcomeSide===1?'красные':'жёлтые'));

      m.style.setProperty('--b',outcomeSide===1?'var(--red-b)':'var(--yel-b)');
      m.style.setProperty('--a2',outcomeSide===1?'var(--yel-a)':'var(--red-a)');
      m.style.setProperty('--b2',outcomeSide===1?'var(--yel-b)':'var(--red-b)');
      loserSide=3-outcomeSide;
      /* фант достаётся проигравшему: вдвоём видят оба, по сети — только он сам */
      if(mode!==3 || outcomeSide!==net.seat){

      m.style.setProperty('--a2','var(--yel-a)');
      m.style.setProperty('--b2','var(--yel-b)');
    }
  }
  sheetEl.classList.add('on'); backdrop.classList.add('on'); pillEl.classList.remove('on');

/* ===================== РАУНД ===================== */
function newRound(){
  session++;
  var pool = mode===0?EASY:mode===1?HARD:WORDS;
  secret=pickSecret(pool);
  var rows=ROWS[mode];
  curRow=0; curGuess=[];
  over=false; locked=false;
  plies=0;
  if(mode===3){ starter = net.round%2===0?1:2; turn=starter; attemptsUsed={1:0,2:0}; }
  else if(mode===2){ starter=3-starter; turn=starter; attemptsUsed={1:0,2:0}; }
  else turn=1;
  pillEl.classList.remove('on');
  buildGrid(rows);
  resetKeyboard();
  fit();
  paintTurnRow();
  paintScoreboard();
  paintHint();
  liveEl.textContent = mode===3
    ? ('Загадано общее слово. '+(turn===net.seat?'Ваш ход.':'Первым ходит соперник.'))
    : mode===2
    ? ('Загадано общее слово. Первыми ходят '+(turn===1?'красные':'жёлтые')+'.')
    : 'Загадано новое слово из 5 букв.';
  hideTip();
  if(!tipsSeen.start){
    var st=session;
    setTimeout(function(){
      if(st!==session||over) return;
      if(notMine()) return;          /* ждущему это подсказывать незачем */
      markTip('start');
      showTip('Введите любое слово из пяти букв и нажмите ✓',0,5200);
    },780);
  }
}

/* ===================== ЗАСТАВКА ===================== */
var MINI_WORD='слово';
var MINI_STATE=['absent','correct','present','absent','correct'];
var miniTimers=[];
function playMini(){
  miniTimers.forEach(clearTimeout); miniTimers=[];
  var tiles=mgridEl.querySelectorAll('.mtile');
  var i;
  for(i=0;i<tiles.length;i++){ tiles[i].className='mtile'; tiles[i].textContent=''; }
  function at(ms,fn){ miniTimers.push(setTimeout(fn,ms)); }
  for(i=0;i<5;i++){
    (function(idx){
      at(200+idx*220,function(){
        tiles[idx].textContent=MINI_WORD[idx].toUpperCase();
        tiles[idx].classList.add('show');
      });
    })(i);
  }
  var flipStart=1650;
  for(i=0;i<5;i++){
    (function(idx){
      at(flipStart+idx*230,function(){ tiles[idx].classList.add('flip'); });
      at(flipStart+idx*230+230,function(){ tiles[idx].classList.add(MINI_STATE[idx]); });
    })(i);
  }
  at(flipStart+5*230+950,playMini);
}

/* ===================== ЗАПУСК ===================== */
kbdEl.addEventListener('click',function(e){
  var btn=e.target.closest('.key');
  if(!btn) return;
  var k=btn.getAttribute('data-k');
  if(k==='ENTER') onEnter();
  else if(k==='BACK') onBack();
  else onLetter(k);
});
document.addEventListener('keydown',function(e){
  if(!app.classList.contains('playing')) return;
  if(e.key==='Enter'){ e.preventDefault(); onEnter(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); onBack(); return; }
  var low=(e.key||'').toLowerCase();
  if(low.length===1 && ALPHABET.indexOf(low)>=0){ onLetter(low); }
});
function startGame(m){
  mode=m;
  wins=[0,0,0]; solved=0; played=0; starter=2;
  gameEl.classList.toggle('duo',duo());
  app.classList.add('playing');
  document.body.classList.toggle('playing-net',m===3);
  newRound();
}
[].slice.call(document.querySelectorAll('.row')).forEach(function(r){
  r.addEventListener('click',function(){
    var m=+r.getAttribute('data-mode');
    if(m===3) NET.open(); else startGame(m);
  });
});
function toMenu(){
  if(NET.on) NET.leave();
  session++; over=true; locked=true;
  hideTip();
  closeSheet(false);
  app.classList.remove('playing');
  document.body.classList.remove('playing-net');
  playMini();
}
document.getElementById('toMenu').addEventListener('click',toMenu);

/* ---------- игра по сети ---------- */
/* Вся механика — в общем net.js. Здесь только то, что знает игра:
   ход — это слово целиком, а загадано оно от общего зерна комнаты. */
NET.init({
  game:'5-bukv',
  title:'5 букв',
  applied:function(){ return plies; },
  begin:function(c){ net.seat=c.seat; net.round=c.round; startGame(3); },
  round:function(c){ net.round=c.round; closeSheet(false); newRound(); },
  move:function(v){ applyGuess(v); },
  ended:toMenu
});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
var fitTimer=null;
function fitDebounced(){
  clearTimeout(fitTimer);
  fitTimer=setTimeout(fit,80);
}
window.addEventListener('resize',fitDebounced);
window.addEventListener('orientationchange',function(){ setTimeout(fit,250); });
if(window.ResizeObserver) new ResizeObserver(fitDebounced).observe(arenaEl);
