<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>

<!-- превью ссылки в Telegram, WhatsApp и других мессенджерах: без этого приглашение
     в сетевую игру приходит голой ссылкой. Картинка — по полному адресу, иначе не покажут -->

<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --well:#E8E8ED;
  --fill:rgba(118,118,128,.12);
  --slider:#FFFFFF;
  --sep:#D6D6DB;
  --label:#000000;
  --label2:#6E6E73;
  --label3:#8E8E93;
  --tint:#007AFF;
  --ok:#248A3D;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --spring:cubic-bezier(.34,.62,.3,1.25);
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.14);
  --tile-shadow:0 1px 2px rgba(0,0,0,.10),0 2px 6px -3px rgba(0,0,0,.14);
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --fill:rgba(118,118,128,.24);
    --slider:#4C4C50;
    --sep:#48484C;
    --label:#FFFFFF;
    --label2:#98989E;
    --label3:#76767C;
    --tint:#0A84FF;
    --ok:#30D158;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --tile-shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --fill:rgba(118,118,128,.24);
    --slider:#4C4C50;
    --sep:#48484C;
    --label:#FFFFFF;
    --label2:#98989E;
    --label3:#76767C;
    --tint:#0A84FF;
    --ok:#30D158;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --tile-shadow:0 1px 2px rgba(0,0,0,.35);
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
/* Повернули телефон боком и обратно — текст и всё, что от него зависит, стали
   крупнее: iPhone в альбомной ориентации сам увеличивает шрифт («автоподбор
   текста») и обратно его не возвращает. Размеры здесь подобраны под экран —
   автоподбор выключен. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
  transition:transform .34s var(--spring),opacity .26s ease;
  will-change:transform;
}
/* Планшет и компьютер: колонка шириной с телефон по центру окна, как в
   «4 в ряд» и на главном экране, — а не список, табло и кнопки во всю ширину.
   Низкий альбомный телефон не трогаем: там ширина нужна раскладке «руки по бокам». */
@media (min-width:600px) and (min-height:561px){
  .screen{padding-left:max(calc(env(safe-area-inset-left) + 16px),calc((100% - 520px)/2));
          padding-right:max(calc(env(safe-area-inset-right) + 16px),calc((100% - 520px)/2))}
}
#game{transform:translateX(100%)}
#app.playing #game{transform:none}
#app.playing #menu{transform:translateX(-22%);opacity:0;pointer-events:none}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#menu>*{flex-shrink:0}
/* Ничто в меню не сжимается меньше своего содержимого: на низком экране
   (iPhone SE в Safari — 375×548) меню прокручивается, а не сплющивает
   заставку в полоску и не наезжает подписью на заголовок списка. */
.brand{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ---------- заставка меню: две карты, общий символ вспыхивает на обеих ---------- */
.mini{
  position:relative;width:min(62%,216px);aspect-ratio:5/2;
  background:var(--surface);border-radius:18px;overflow:hidden;
  box-shadow:var(--card-shadow);margin-bottom:30px;
  flex:none;
}
.mini .mc{
  position:absolute;top:50%;width:37%;aspect-ratio:1;transform:translate(-50%,-50%);
  transition:transform .42s var(--spring),opacity .3s ease;
}
.mini .mc.l{left:29%}.mini .mc.r{left:71%}
.mini .mc.swap{opacity:0;transform:translate(-50%,-50%) scale(.7) rotate(-30deg)}
.mini .mc svg{display:block;width:100%;height:100%;overflow:visible}
.mini .mc svg.face{clip-path:circle(50% at 50% 50%)}
.mini .mc.l{--hc:var(--red-b)}
.mini .mc.r{--hc:var(--yel-b)}
.mini .mc{border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--sep),var(--tile-shadow)}

/* ---------- поле ---------- */
#game{touch-action:none;-webkit-user-select:none;user-select:none}
.stage{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:6px 0 2px;
}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;min-height:0;width:100%;padding:8px;border-radius:24px;transition:opacity .25s ease;background:color-mix(in srgb,var(--red-b) 7%,transparent)}
.zone.top{background:color-mix(in srgb,var(--yel-b) 9%,transparent)}
.zone.top{flex-direction:column-reverse}
/* вдвоём телефон лежит на столе: верхняя половина смотрит на второго игрока */
.duo .zone.top{transform:rotate(180deg);flex-direction:column}
.tag{
  display:flex;align-items:center;gap:6px;height:20px;
  font-size:13px;color:var(--label2);letter-spacing:-.05px;white-space:nowrap;
}
.tag .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag.s1 .dot{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.tag.s2 .dot{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.tag b{display:inline-block;font-size:15px;font-weight:700;color:var(--label);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tag b.bump{animation:bump .5s var(--spring)}
@keyframes bump{35%{transform:scale(1.5)}}
.tag .cap{color:var(--label3)}

.dc{
  position:relative;width:var(--d,200px);height:var(--d,200px);border-radius:50%;flex:none;
  background:#fff;
  box-shadow:0 2px 0 rgba(32,36,49,.08),0 8px 24px -12px rgba(32,36,49,.28);
  transition:opacity .25s ease;
}
.dc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* выросший в момент взятки символ не вылезает за край карты */
.dc svg.face{clip-path:circle(50% at 50% 50%)}
.dc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 3px var(--ring,transparent)}
.dc.s1{--ring:var(--red-b);--hc:var(--red-b)}
.dc.s2{--ring:var(--yel-b);--hc:var(--yel-b)}
.dc.me{cursor:pointer}
/* рубашка: две фишки серии, красная и жёлтая; на время отсчёта уходят */
.dc.back{background:var(--well)}
.dc.back svg.face{opacity:0}
.dc.back::before{
  content:"";position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;border-radius:50%;
  transform:translate(-106%,-50%);background:var(--red-b);
  box-shadow:calc(var(--d,200px)*.143) 0 0 var(--yel-b);
  transition:opacity .2s ease,transform .3s var(--spring);
}
.dc.back.counting::before{opacity:0;transform:translate(-106%,-50%) scale(.4)}
.zone.miss .dc{animation:shake .4s ease}
.zone.frozen .dc.me svg.face{opacity:.38;filter:saturate(.2)}
@keyframes shake{0%,100%{translate:0}18%{translate:-8px}40%{translate:7px}62%{translate:-4px}82%{translate:2px}}
/* штраф: вокруг своей карты тает кольцо — пока оно не исчезло, жать нельзя */
.dc .pen{pointer-events:none;opacity:0;transform:rotate(-90deg);transition:opacity .15s ease}
.dc .pen circle{fill:none;stroke:var(--label2);stroke-width:3.5px;vector-effect:non-scaling-stroke;
  stroke-dasharray:305;stroke-dashoffset:0;stroke-linecap:round}
.zone.frozen .dc .pen{opacity:1}
.zone.frozen .dc .pen circle{animation:drain 1.1s linear forwards}
@keyframes drain{to{stroke-dashoffset:305}}

.sy{transform-box:fill-box;transform-origin:center}
.sy .sticker{stroke:#202431;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.sy .detail{stroke:none}
.sy .hit{fill:transparent;stroke:none}
/* ореол за символом — цвета того, кто взял карту */
.sy .halo{fill:var(--hc,var(--label3));opacity:0;transform-box:fill-box;transform-origin:center}
.sy.win{animation:win .5s var(--spring) forwards}
.sy.win .halo{animation:halo .45s ease-out forwards}
.sy.won{transform:scale(1.18)}
.sy.won .halo{opacity:.26}
.sy.unwon{animation:unwon .5s ease forwards}
.sy.unwon .halo{animation:unhalo .5s ease forwards}
.sy.tap{animation:tapq .22s ease}
.sy.bad{animation:bad .42s ease}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.34)}100%{transform:scale(1.18)}}
@keyframes halo{0%{opacity:0;transform:scale(.4)}100%{opacity:.26;transform:scale(1)}}
@keyframes unwon{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes unhalo{from{opacity:.26}to{opacity:0}}
@keyframes tapq{50%{transform:scale(.86)}}
@keyframes bad{0%,100%{transform:none}22%{transform:rotate(-16deg) scale(.9)}48%{transform:rotate(12deg) scale(.9)}74%{transform:rotate(-6deg)}}

.mid{flex:none;position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:20px}
.left{font-size:12px;color:var(--label2);font-weight:600;letter-spacing:.1px;font-variant-numeric:tabular-nums}
.count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:16px;
  background:var(--surface);padding:10px 22px;border-radius:20px;box-shadow:var(--card-shadow);pointer-events:none;z-index:4;opacity:0}
.count.on{opacity:1}
.count b{font-size:32px;line-height:1;font-weight:800;color:var(--label);font-variant-numeric:tabular-nums}
.count b.c2{display:none}
.duo .count b.c2{display:block;transform:rotate(180deg)}
.count.tick b.c1{animation:cnt .5s var(--spring)}
.count.tick b.c2{animation:cnt2 .5s var(--spring)}
@keyframes cnt{0%{transform:scale(1.3);opacity:0}45%{opacity:1}100%{transform:none}}
@keyframes cnt2{0%{transform:rotate(180deg) scale(1.3);opacity:0}45%{opacity:1}100%{transform:rotate(180deg)}}
.hint{
  flex:none;margin:4px 0 0;min-height:19px;text-align:center;
  font-size:13px;font-weight:600;letter-spacing:-.1px;color:var(--label2);transition:color .2s ease;
}
.hint.good{color:var(--ok)}
.duo .hint{display:none}
.wordmark{margin:0;width:min(240px,76%);line-height:0;color:var(--label)}
.wordmark svg{display:block;width:100%;height:auto;fill:currentColor}
.tagline{margin:9px 0 0;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- навигация ---------- */
/* сетка, а не флекс: боковые колонки равны, и название стоит по центру
   экрана, а не по центру того, что осталось от кнопок */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;flex:none}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;border:0;background:none;padding:0;cursor:pointer;
  color:var(--tint);font:inherit;font-size:17px;letter-spacing:-.3px;
}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav .ttl{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.35px}
.icon{
  justify-self:end;width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--fill);
  color:var(--tint);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- шторка итога ---------- */
.scrim{
  position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
/* Телефон боком: два диска по высоте не помещаются — своя, нижняя,
   уходила за край, и играть было нельзя. Пока идёт партия и телефон лёг
   боком, просим повернуть его обратно. Меню, лобби и шторки работают и боком. */
.turn{display:none}
@media (orientation:landscape) and (max-height:510px) and (pointer:coarse){
  #app.playing .turn{
    position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px;background:var(--bg);text-align:center;
  }
}
.turn svg{width:48px;height:48px;margin-bottom:6px;fill:none;stroke:var(--tint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.turn b{font-size:20px;font-weight:700;letter-spacing:-.35px}
.turn span{font-size:14px;color:var(--label2);letter-spacing:-.1px}
.scrim.on{opacity:1;pointer-events:auto}
/* закрытая шторка уезжает за край вместе со своей тенью: сдвинутая только
   на свою высоту, она оставляла тень на виду — серую полосу по низу экрана */
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  max-width:520px;margin:0 auto;
  border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(calc(100% + 60px));transition:transform .4s var(--spring);
  box-shadow:0 -12px 40px rgba(0,0,0,.16);
}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.medal{
  width:56px;height:56px;border-radius:50%;margin:2px auto 14px;display:grid;place-items:center;
  box-shadow:var(--thumb-shadow);
}
.medal svg{width:28px;height:28px;fill:#fff}
.medal.a{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.medal.b{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.medal.n{background:var(--fill)}
.medal.n svg{fill:var(--label3)}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:-.45px}
.sheet p{margin:5px 0 22px;text-align:center;font-size:15px;color:var(--label2);letter-spacing:-.1px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;
  color:inherit;font:inherit;cursor:pointer;transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die{transform:rotate(90deg)}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:14px;cursor:pointer;
  font:inherit;font-size:17px;font-weight:600;letter-spacing:-.3px;
  background:var(--fill);color:var(--label);transition:transform .14s var(--spring),opacity .14s;
}
.btn+.btn{margin-top:9px}
.btn.primary{background:var(--tint);color:#fff}
.btn:active{transform:scale(.97);opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){
  /* число повторов обязательно: бесконечная анимация (точки ожидания, пульс
     победной фишки), сжатая до миллисекунды, не замирает, а мерцает */
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
@media (max-height:660px){
  .wordmark{width:min(205px,72%)}
  .mini{margin-bottom:22px}
  .footnote{margin-top:10px}
  .legal{margin-top:7px}
  .row{padding:11px 16px}
}

/* Закрытые диалоги не должны оставаться в навигации клавиатуры и скринридера. */
.sheet{visibility:hidden}
.sheet.on{visibility:visible}

/* ===== колода: конечная проективная плоскость порядка 5 =====
   31 карта по 6 символов, у любых двух карт ровно один общий символ.
   Точки плоскости — символы, прямые — карты. Считается, а не хранится:
   так гарантия «ровно одно совпадение» держится на математике, а не
   на аккуратности набора. */
/* SIM-START */
var ORDER=5;
function buildDeck(){
  var n=ORDER, d=[], m, b, x, c, y;
  for(m=0;m<n;m++) for(b=0;b<n;b++){
    var card=[];
    for(x=0;x<n;x++) card.push(x*n+((m*x+b)%n));
    card.push(n*n+m);
    d.push(card);
  }
  for(c=0;c<n;c++){
    var v=[];
    for(y=0;y<n;y++) v.push(c*n+y);
    v.push(n*n+n);
    d.push(v);
  }
  var inf=[]; for(m=0;m<=n;m++) inf.push(n*n+m);
  d.push(inf);
  return d;
}
function common(a,b){
  for(var i=0;i<a.length;i++) if(b.indexOf(a[i])>-1) return a[i];
  return -1;
}
function pairSchedule(order){
  var pairs=[];
  for(var i=0;i<29;i++) pairs.push([order[(i*2)%order.length],order[(i*2+1)%order.length]]);
  return pairs;
}
/* SIM-END */

/* Карты летают через Web Animations: откуда и куда лететь, считается по

var still=window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
function calm(){ return !!(still && still.matches) || typeof document.body.animate!=='function'; }
function move(el,frames,opt){
  if(calm()) return null;
  try{
    var a=el.animate(frames,opt);
    running.push(a);
    a.addEventListener('finish',function(){ var i=running.indexOf(a); if(i>-1) running.splice(i,1); });
    return a;
  }catch(e){ return null; }
}

/* ===== рисование карты ===== */
/* Шесть мест: одно в середине и пять по кругу. Раскладка крутится целиком,
   а каждый символ — ещё и сам по себе, и размер у всех свой: как в
   настоящей колоде, узнавать символ приходится в любом повороте. */
function layout(card){
  var turn=Math.random()*360, order=card.slice(), i, out=[];
  for(i=order.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=order[i]; order[i]=order[j]; order[j]=t; }
  for(i=0;i<order.length;i++){
    var x=0,y=0,sz;
    if(i===0) sz=42+Math.random()*10;
    else{
      var a=(turn+(i-1)*72)*Math.PI/180;
      x=Math.cos(a)*62; y=Math.sin(a)*62;
      sz=47+Math.random()*14;
    }
    out.push({s:order[i],x:x,y:y,r:Math.random()*360,k:sz/24});
  }
  return out;
}
function symSvg(s){ return SYM[s][1]; }
/* Меняется только лицо карты (svg.face): кольцо штрафа и прочее, что лежит
   в карте рядом, остаётся на месте. Группа с классом .sy — без атрибута
   transform: его заменила бы CSS-анимация символа. */
function paintCard(el,cardNo,keep){
  var old=el.querySelector('svg.face');
  if(cardNo<0){ if(old) el.removeChild(old); lay[el.id]=null; el.removeAttribute('aria-label'); return; }
  var L = keep && lay[el.id] && lay[el.id].no===cardNo ? lay[el.id].items : layout(DECK[cardNo]);
  lay[el.id]={no:cardNo,items:L};
  var h='<svg class="face" viewBox="-100 -100 200 200" aria-hidden="true">';
  L.forEach(function(it){
    h+='<g transform="translate('+it.x.toFixed(1)+' '+it.y.toFixed(1)+') rotate('+it.r.toFixed(0)+') scale('+it.k.toFixed(3)+')">'+
       '<g class="sy '+SYM[it.s][0]+'" data-s="'+it.s+'"><g transform="translate(-12 -12)">'+
       '<circle class="hit" cx="12" cy="12" r="12"/>'+symSvg(it.s)+'</g></g></g>';
  });
  var box=document.createElement('div');
  box.innerHTML=h+'</svg>';
  if(old) el.replaceChild(box.firstChild,old); else el.insertBefore(box.firstChild,el.firstChild);
  el.setAttribute('aria-label','Карта: '+DECK[cardNo].map(function(s){ return NAMES[s]; }).join(', '));
}
/* Подсветить символ: win — рост и ореол цвета взявшего, won — то же без
   движения (у летящей копии), unwon — обратно к обычному, tap — нажатие,
   bad — промах. Ореол — кружок за символом, заводится по первому разу. */
function flash(el,s,cls){
  var g=el.querySelector('.sy[data-s="'+s+'"]');
  if(!g) return;
  var inner=g.firstChild;
  if(inner && !inner.querySelector('.halo')){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','halo'); c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','16');
    inner.insertBefore(c,inner.firstChild);
  }
  g.classList.remove('win','won','unwon','tap','bad'); void g.getBoundingClientRect(); g.classList.add(cls);
}
/* Какой символ под пальцем.

   Раньше точка касания переводилась в координаты карты через getScreenCTM().
   В Safari он не учитывает CSS-трансформации предков (WebKit bug 209220),
   а вдвоём верхняя половина стола повёрнута на 180° — на iPhone касания по
   карте верхнего игрока уходили за пределы карты, и символы не нажимались.
   Chrome и Android этого не замечали.

   Теперь сначала спрашиваем сам браузер, в какой символ попал палец: его
   попадание всегда учитывает поворот. Промахнулся мимо круга символа —
   ищем ближайший с небольшим запасом, а точку карты считаем по экранным
   положениям двух символов (toCard), без getScreenCTM. */
function pick(el,e){
  var L=lay[el.id]; if(!L) return -1;
  var t=e.target, g=t&&t.closest?t.closest('.sy'):null;
  if(g && el.contains(g)) return +g.getAttribute('data-s');
  var q=toCard(el,L,e.clientX,e.clientY), best=-1, bd=1e9;
  if(!q) return -1;
  L.items.forEach(function(it){
    var dx=q.x-it.x, dy=q.y-it.y, d=dx*dx+dy*dy, lim=it.k*14;
    if(d<bd && d<lim*lim){ bd=d; best=it.s; }
  });
  return best;
}
/* Точка экрана → координаты карты. Два символа известны и в координатах
   карты (раскладка), и на экране (центры их кругов-мишеней, а рамки
   getBoundingClientRect учитывают любые повороты во всех браузерах). По двум
   парам точек восстанавливаются поворот, масштаб и сдвиг: в комплексных
   числах экран = a·карта + b, отсюда карта = p1 + (экран − s1)/a. */
function toCard(el,L,X,Y){
  var P=[], i, c, r;
  for(i=0;i<L.items.length && P.length<2;i++){
    c=el.querySelector('.sy[data-s="'+L.items[i].s+'"] .hit');
    r=c && c.getBoundingClientRect();
    if(r && r.width) P.push({x:L.items[i].x, y:L.items[i].y, X:r.left+r.width/2, Y:r.top+r.height/2});
  }
  if(P.length<2) return null;
  var px=P[1].x-P[0].x, py=P[1].y-P[0].y, sx=P[1].X-P[0].X, sy=P[1].Y-P[0].Y, n=px*px+py*py;
  if(!n) return null;
  var ax=(sx*px+sy*py)/n, ay=(sy*px-sx*py)/n, an=ax*ax+ay*ay;      /* a = (s2 − s1)/(p2 − p1) */
  if(!an) return null;
  var dx=X-P[0].X, dy=Y-P[0].Y;
  return {x:P[0].x+(dx*ax+dy*ay)/an, y:P[0].y+(dy*ax-dx*ay)/an};
}

function say(t,good){ hint.textContent=t; hint.classList.toggle('good',!!good); if(t) liveEl.textContent=t; }
function el(side){ return side===mySide() ? cBot : cTop; }
function zoneOf(side){ return side===mySide() ? zBot : zTop; }

function paintTags(){
  var w=who(), me=mySide(), op=oppSide();
  $('nameBot').textContent=w[me-1];   $('numBot').textContent=shown[me-1];
  $('nameTop').textContent=w[op-1];   $('numTop').textContent=shown[op-1];
  tagBot.className='tag s'+me; tagTop.className='tag s'+op;
  var n=pile.length-k;
  leftEl.textContent = over ? 'Поиск завершён' : 'Совпадение '+Math.min(k+1,pile.length)+' из '+pile.length;
}
function bump(e){ e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }
function baseHint(){
  return 'Найдите общий предмет на двух дисках';
}

/* ===== партия ===== */
function loadPair(){
  hand=pile[k].slice();
  paintCard(cBot,hand[mySide()-1]);
  paintCard(cTop,hand[oppSide()-1]);
}
function deal(first){
  stop(); closeSheet();
  var rnd=(mode===3 && NET.rng) ? NET.rng : Math.random;
  var order=[],i;
  for(i=0;i<DECK.length;i++) order.push(i);
  for(i=order.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)),t=order[i];order[i]=order[j];order[j]=t; }
  // Одинаковое расписание у обоих телефонов. В каждой паре разные карты,
  // при следующем совпадении меняются оба диска. 29 очков за партию.
  pile=pairSchedule(order);
  k=0;score=[0,0];shown=[0,0];frozen=[0,0];pending=0;plies=0;
  over=false;lock=true;anim=true;stage.dataset.ready='false';
  zTop.classList.remove('miss','frozen');zBot.classList.remove('miss','frozen');
  cBot.className='dc me s'+mySide()+' back';
  cTop.className='dc s'+oppSide()+(mode===2?' me':'')+' back';
  countEl.className='count';countEl.innerHTML='';
  loadPair();paintTags();fit();say('Приготовьтесь');
  [cBot,cTop].forEach(function(card){
    move(card,[{transform:'scale(.82)',opacity:0},{transform:'scale(1)',opacity:1}],
      {duration:360,delay:first?230:0,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  });
  later(countdown,first&&!calm()?550:0);
}
function countdown(){
  var n=3;
  countEl.classList.add('on');
  (function tick(){
    if(n>0){
      countEl.innerHTML='<b class="c2">'+n+'</b><b class="c1">'+n+'</b>';
      countEl.classList.remove('tick');void countEl.offsetWidth;countEl.classList.add('tick');
      haptic(12,'tick');n--;later(tick,520);return;
    }
    countEl.classList.remove('on','tick');countEl.innerHTML='';
    [cBot,cTop].forEach(function(card){
      card.classList.remove('back');
      move(card,[{transform:'perspective(900px) rotateY(-85deg)',opacity:.3},{transform:'perspective(900px) rotateY(0deg)',opacity:1}],
        {duration:300,easing:'cubic-bezier(.22,1,.36,1)'});
    });
    later(function(){lock=false;anim=false;stage.dataset.ready='true';say(baseHint());thinkAI();},calm()?0:300);
  })();
}

/* Тап по своему диску. Верный символ — заявка на общее совпадение;
   неверный — секунда штрафа, чтобы не выигрывать, стуча по всему подряд. */
function tapCard(side,e){
  if(lock||anim||over||k>=pile.length) return;
  if(Date.now()<frozen[side-1]) return;
  if(mode===3 && pending) return;
  var cardEl=el(side), s=pick(cardEl,e);
  if(s<0) return;
  if(DECK[hand[2-side]].indexOf(s)<0){ miss(side,cardEl,s); return; }
  if(mode===3){
    /* Кто первый — решает сервер: заявки обоих ложатся в один список по
       времени прихода, и у обоих телефонов одинаково выигрывает первая.
       Поэтому свою заявку не разыгрываем сразу, а ждём её обратно. */
    var kk=k;
    pending=kk+1;
    flash(cardEl,s,'tap'); haptic(6);
    NET.send([net.seat,kk,s]);
    later(function(){ if(pending===kk+1) pending=0; },2500);
    return;
  }
  claim(side,k,s,false);
}
function miss(side,cardEl,s){
  frozen[side-1]=Date.now()+1100;
  var z=zoneOf(side);
  z.classList.remove('miss','frozen'); void z.offsetWidth; z.classList.add('miss','frozen');
  flash(cardEl,s,'bad');
  haptic(10,'error');
  if(mode!==2) say('Мимо — секунда штрафа');
  later(function(){ z.classList.remove('miss','frozen'); if(!over && mode!==2) say(baseHint()); },1100);
}

/* Первое подтверждённое совпадение приносит одно очко. Обе карты
   следующей пары меняются вместе; запоздавшая заявка не получает очка. */
function claim(side,kk,s,quick){
  if(over || kk!==k || k>=pile.length) return false;
  if(side!==1 && side!==2) return false;
  if(DECK[hand[0]].indexOf(s)<0 || DECK[hand[1]].indexOf(s)<0) return false;
  clearTimeout(aiTimer);pending=0;anim=true;stage.dataset.ready='false';
  score[side-1]++;shown=score.slice();k++;
  paintTags();bump($(el(side)===cBot?'numBot':'numTop'));
  function next(){
    if(k>=pile.length){anim=false;finish();return;}
    loadPair();paintTags();
    [cBot,cTop].forEach(function(card){
      move(card,[{transform:'scale(.88) rotate(-6deg)',opacity:0},{transform:'scale(1)',opacity:1}],
        {duration:280,easing:'cubic-bezier(.22,1,.36,1)'});
    });
    later(function(){anim=false;stage.dataset.ready='true';say(baseHint());thinkAI();},calm()?0:280);
  }
  if(quick){
    if(k>=pile.length){anim=false;finish();}
    else{loadPair();paintTags();anim=false;stage.dataset.ready='true';thinkAI();}
    return true;
  }
  var color=side===1?'var(--red-b)':'var(--yel-b)';
  [cBot,cTop].forEach(function(card){card.style.setProperty('--hc',color);flash(card,s,'win');});
  haptic(side===mySide()||mode===2?14:8);
  say(who()[side-1]+' +1 · '+NAMES[s],side===mySide());
  later(function(){
    [cBot,cTop].forEach(function(card){
      move(card,[{transform:'scale(1)',opacity:1},{transform:'scale(.9) rotate(5deg)',opacity:0}],
        {duration:140,easing:'ease-in'});
    });
    later(next,calm()?0:140);
  },calm()?80:260);
  return true;
}

/* ===== ИИ ===== */
/* Он «ищет» совпадение столько, сколько искал бы человек: лёгкий —
   неторопливо, сложный — быстро, но не мгновенно, иначе играть незачем. */
function thinkAI(){
  if(mode>1 || over) return;
  clearTimeout(aiTimer);
  var ms = mode===0 ? 3600+Math.random()*3400 : 1700+Math.random()*1500;
  var s0=session, kk=k;
  aiTimer=setTimeout(function(){
    if(s0!==session || over || k!==kk) return;
    if(anim||lock){ thinkAI(); return; }
    var s=common(DECK[hand[0]],DECK[hand[1]]);
    claim(2,k,s,false);
  },ms);
}

/* ===== итог ===== */
function rollForfeit(){
  var i;
  do{ i=(Math.random()*FORFEIT.length)|0; } while(i===lastForfeit&&FORFEIT.length>1);
  lastForfeit=i;
  if(mode===2){
    if(named(loserSide)) return who()[loserSide-1]+' '+FORFEIT[i][2];
    return (loserSide===1?'Красные ':'Жёлтые ')+FORFEIT[i][0];
  }
  return 'Вы '+FORFEIT[i][1];
}
forfeitEl.addEventListener('click',function(){
  forfeitEl.classList.add('roll');
  setTimeout(function(){ ftextEl.textContent=rollForfeit(); forfeitEl.classList.remove('roll'); },170);
});
/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g;
    try{ duel(d,id,r); }catch(e){}
    write(d);
    /* итог партии — тем, кто слушает: мини-турнир (tour.js) ведёт по нему счёт.
       Бросаем после записи, чтобы слушатель читал уже обновлённую память. */
    try{ document.dispatchEvent(new CustomEvent('dp:save',{detail:{id:id,win:r.win,mode:r.mode}})); }catch(e){}
  }
  /* Сброс статистики стирает только историю партий. Имена, тема и звук —
     настройки, а не статистика: раньше сброс стирал весь ключ, и вместе
     со счётом пропадали имена, выбранная тема и выключенный звук. */
  function clear(){ var d=read(); d.games={}; delete d.duel; write(d); }

  /* ---------- кто кого ----------
     Партия на двоих — на одном телефоне или по сети — пишется ещё и по
     людям: кто выиграл, я или соперник. Счёт по цветам для этого не
     годится: по сети моё место в каждой комнате своё.
     На одном телефоне я — всегда первая сторона (так устроены имена), по
     сети — своё место NET.seat. Соперник на одном телефоне — роль «друг»,
     а не имя: переименуют — счёт останется за ним. По сети соперника узнаём
     по имени, и если оно совпало с именем друга — это он и есть. */
  var PAIRS=12, LOG=40;
  /* день начинается в четыре утра: партия после полуночи — тот же вечер */
  function day(t){ var x=new Date(t-4*36e5); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  function duel(d,id,r){
    if(r.mode!==2) return;                          /* против ИИ и в одиночку — не пара */
    var N=window.NET, net=!!(N&&N.on), mine=net?N.seat:1;
    if(mine!==1 && mine!==2) return;
    var opp=net?clip(N.oppName):'', key=net?'net:'+opp.toLowerCase():'duo';
    var res = r.win===mine ? 1 : (r.win===1||r.win===2) ? 2 : 0;   /* 1 — я, 2 — соперник, 0 — ничья */
    var now=Date.now(), P=d.duel||(d.duel={p:{}});
    var p=P.p[key]||(P.p[key]={me:0,them:0,draw:0,g:{},log:[],run:null,since:now});
    if(net) p.name=opp;
    if(res===1) p.me++; else if(res===2) p.them++; else p.draw++;
    var t=p.g[id]||(p.g[id]=[0,0,0]);
    t[res===1?0:res===2?1:2]++;
    p.log.push([now,res,id]);
    if(p.log.length>LOG) p.log.splice(0,p.log.length-LOG);
    var today=day(now);
    if(!p.run || p.run.d!==today)
      p.run={d:today, n:(p.run && p.run.d===day(now-864e5)) ? p.run.n+1 : 1};
    p.last=now;
    fold(d);
    /* соперников по сети может набраться много — держим дюжину последних */
    var keys=Object.keys(P.p);
    if(keys.length>PAIRS){
      keys.sort(function(a,b){ return (P.p[a].last||0)-(P.p[b].last||0); });
      delete P.p[keys[0]];
    }
  }
  /* Друг с одного телефона и тот же человек по сети — одна пара. Имя друга
     могли вписать и после сетевых партий, поэтому сводим при каждом чтении. */
  function fold(d){
    var P=d.duel, f=names().friend, k='net:'+f.toLowerCase();
    if(!P || !P.p || !f || !P.p[k]) return false;
    var a=P.p.duo, b=P.p[k], id, i;
    if(!a){ P.p.duo=b; delete b.name; delete P.p[k]; return true; }
    a.me+=b.me; a.them+=b.them; a.draw+=b.draw;
    for(id in b.g) if(Object.prototype.hasOwnProperty.call(b.g,id)){
      var x=a.g[id]||(a.g[id]=[0,0,0]);
      for(i=0;i<3;i++) x[i]+=b.g[id][i];
    }
    a.log=a.log.concat(b.log).sort(function(u,v){ return u[0]-v[0]; }).slice(-LOG);
    /* серия вечеров — та, что свежее; в один и тот же день — та, что длиннее */
    if(b.run && (!a.run || (b.run.d===a.run.d ? b.run.n>a.run.n : (b.last||0)>(a.last||0)))) a.run=b.run;
    a.since=Math.min(a.since||b.since, b.since||a.since);
    a.last=Math.max(a.last||0, b.last||0);
    delete P.p[k];
    return true;
  }
  function pair(){
    var d=read();
    if(fold(d)) write(d);
    return d.duel||null;
  }
  function pairReset(key){
    var d=read();
    if(d.duel && d.duel.p && d.duel.p[key]){ delete d.duel.p[key]; write(d); }
  }

  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero,
          pair:pair,pairReset:pairReset,day:day};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();
function finish(){
  over=true; lock=true; anim=false;
  clearTimeout(aiTimer);
  var w = score[0]>score[1] ? 1 : (score[1]>score[0] ? 2 : 0);
  var res=score[0]+' : '+score[1];
  if(mode===3) NET.result(w);
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('dobble',{win:w,mode:mode===3?2:mode,
    note:(mode===3?'По сети · ':'')+'Очков '+score[0]+' : '+score[1]});
  medal.className='medal '+(w===1?'a':w===2?'b':'n');
  if(!w){
    sTitle.textContent='Ничья';
    sText.textContent='Поровну, '+res;
  }else if(mode===2){
    sTitle.textContent = named(w) ? 'Победа: '+who()[w-1] : ((w===1?'Красные':'Жёлтые')+' выиграли');
    sText.textContent='Очков '+res;
  }else if(mode===3){
    sTitle.textContent = w===net.seat ? 'Вы выиграли'
      : (named(w) ? 'Победа: '+who()[w-1] : 'Соперник выиграл');
    sText.textContent='Очков '+res;
  }else{
    sTitle.textContent = w===1 ? 'Вы выиграли' : 'ИИ выиграл';
    sText.textContent='Очков '+res+' — '+(mode===0?'лёгкий':'сложный')+' соперник';
  }
  /* фант достаётся проигравшему: вдвоём видят оба, иначе только он сам */
  var showForfeit = mode===2 ? w>0 : (mode===3 ? (w>0 && w!==net.seat) : w===2);
  if(showForfeit){
    if(mode===2) loserSide = w===1 ? 2 : 1;
    ftextEl.textContent=rollForfeit();
    forfeitEl.classList.add('on');
  }else forfeitEl.classList.remove('on');
  var mine = mode===2 ? true : w===mySide();
  say(!w?'Ничья':(mode===2?'':(mine?'Победа':'Поражение')));
  paintTags();
  haptic(mine&&w ? [14,50,22] : 12);
  /* Диск победителя мягко подчёркивает итог. */
  if(w) move(el(w),[{transform:'scale(1)'},{transform:'scale(1.08)',offset:.35},{transform:'scale(.98)',offset:.7},{transform:'scale(1)'}],
             {duration:620,delay:380,easing:'ease-in-out'});
  later(function(){ scrim.classList.add('on'); sheet.classList.add('on'); },760);
}
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }

/* ===== заставка меню ===== */
/* Две случайные карты колоды, и их единственный общий символ вспыхивает
   на обеих — это и есть вся игра за три секунды. */
var miniL=$('miniL'), miniR=$('miniR'), miniT=[];
function stillMini(){
  miniL.classList.remove('swap'); miniR.classList.remove('swap');
}
function playMini(){
  if(window.DPMotion){
    if(!DPMotion.canPreview()) return;
    DPMotion.cancelPreview();
  }
  stopMini();
  var a=(Math.random()*DECK.length)|0, b;
  do{ b=(Math.random()*DECK.length)|0; } while(b===a);
  paintCard(miniL,a); paintCard(miniR,b);
  miniL.classList.remove('swap'); miniR.classList.remove('swap');
  var s=common(DECK[a],DECK[b]);
  miniT.push(setTimeout(function(){ flash(miniL,s,'win'); flash(miniR,s,'win'); },900));
  miniT.push(setTimeout(function(){ miniL.classList.add('swap'); miniR.classList.add('swap'); },2900));
  miniT.push(setTimeout(playMini,3250));
}
function stopMini(){ miniT.forEach(clearTimeout); miniT=[]; }

/* ===== переходы ===== */
function openGame(m){
  mode=m; app.classList.add('playing'); stopMini(); closeSheet();
  document.body.classList.toggle('playing-net',m===3);
  $('game').classList.toggle('duo',m===2);
  deal(true);
}
function goMenu(){
  if(NET.on) NET.leave();
  document.body.classList.remove('playing-net');
  stop(); closeSheet(); app.classList.remove('playing'); lock=true; over=true; anim=false;
  playMini();
}
Array.prototype.forEach.call(document.querySelectorAll('.row'),function(r){
  r.addEventListener('click',function(){
    var m=+r.dataset.mode;
    if(m===3) NET.open(); else openGame(m);
  });
});
/* касания — по pointerdown: на столе вдвоём жмут одновременно, и ждать
   отпускания пальца значит отдать очко тому, кто быстрее убрал руку */
cBot.addEventListener('pointerdown',function(e){ e.preventDefault(); tapCard(mySide(),e); });
cTop.addEventListener('pointerdown',function(e){ if(mode!==2) return; e.preventDefault(); tapCard(oppSide(),e); });
$('restart').addEventListener('click',function(){ if(mode!==3) deal(); });
$('again').addEventListener('click',function(){
  if(mode===3){ NET.rematch(); return; }          /* по сети раздача начинается по согласию обоих */
  deal();
});

/* ---------- игра по сети ---------- */
/* Вся механика — в общем net.js. Эта игра — первая в серии без очереди:
   ходят оба одновременно, кто быстрее. Поэтому комната заводится в режиме
   free: сервер не спрашивает, чей ход, а просто складывает заявки в один
   список в порядке прихода, и этот список получают оба — вместе со своими
   же заявками. Ход — [место, номер поиска, символ]. Заявка на
   карту, которую уже забрали, у обоих одинаково ничего не делает. */
NET.init({
  game:'dobble',
  roomGame:'dobble-two-discs-v1',
  title:'Доббль',
  free:true,
  applied:function(){ return plies; },
  /* Пока пара меняется, обе стороны применяют заявки в одном порядке. */
  busy:function(){ return anim; },
  begin:function(c){ net.seat=c.seat; net.round=c.round; openGame(3); },
  round:function(c){ net.round=c.round; closeSheet(); deal(); },
  move:function(v,quick){
    plies++;
    if(Object.prototype.toString.call(v)!=='[object Array]') return;
    var ok=claim(v[0]|0,v[1]|0,v[2]|0,!!quick);
    if(!ok && (v[0]|0)===net.seat){ pending=0; }
  },
  ended:goMenu
});
$('toMenuBtn').addEventListener('click',goMenu);
$('toMenuTop').addEventListener('click',goMenu);
scrim.addEventListener('click',closeSheet);
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

window.DPPreview={play:playMini,still:stillMini,stop:function(){ stopMini(); }};
playMini();
})();
</script>
