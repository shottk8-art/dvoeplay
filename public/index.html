<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>
<meta name="description" content="dvoeplay — сборник игр для двоих на одном телефоне: 4 в ряд, Матрёшка, 5 букв, Мемо-дуэль, Доббль, Взломщик кода и другие.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dvoeplay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>dvoeplay — игры для двоих</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7; --surface:#FFFFFF; --well:#E8E8ED;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);
  --tint:#007AFF;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --ink:#1C1C1E;
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -12px rgba(0,0,0,.18);
  --spring:cubic-bezier(.34,1.48,.5,1);
  --ease:cubic-bezier(.32,.72,0,1);
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --card-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --card-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.7);
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--label);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 16px) max(16px,calc((100% - 720px)/2)) calc(env(safe-area-inset-bottom) + 18px);
}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.wordmark{margin:0;font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--label)}
.wordmark .o{
  display:inline-block;width:.6em;height:.6em;border-radius:50%;
  vertical-align:-.045em;margin:0 .015em;
  background:linear-gradient(90deg,var(--red-b) 0 50%,var(--yel-b) 50% 100%);
}
.iconbtn{
  width:36px;height:36px;border:0;border-radius:50%;background:var(--fill);color:var(--label2);
  display:grid;place-items:center;cursor:pointer;transition:transform .16s var(--spring);
}
.iconbtn:active{transform:scale(.9)}
.tools{display:flex;align-items:center;gap:8px}
#sndBtn.off{color:var(--label3)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

.section{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.section h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.45px}
.section span{font-size:13px;color:var(--label3);letter-spacing:-.05px}
.netnote{margin:-4px 2px 12px;font-size:12.5px;line-height:1.35;color:var(--label3);letter-spacing:-.05px}

/* ---------- герой ---------- */
.hero{
  position:relative;display:block;overflow:hidden;text-decoration:none;
  border-radius:24px;padding:18px;height:236px;
  background:radial-gradient(120% 130% at 82% 18%,#3A3A3F 0,#1C1C1E 62%);
  box-shadow:var(--card-shadow);color:#fff;
  transition:transform .18s var(--spring);
  animation:rise .45s var(--ease) both;
}
.hero:active{transform:scale(.985)}
.badge{
  display:inline-block;padding:4px 9px;border-radius:999px;
  background:linear-gradient(180deg,var(--red-a),var(--red-b));
  font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
}
/* Повод виден и по цвету: новое — красное, продолжить — синее, любимая —
   жёлтая. Имена классов с приставкой: короткое .cont в этом файле уже занято
   строкой «Продолжить», и ярлык от неё растягивался на всю карточку. */
.badge.b-cont{background:linear-gradient(180deg,#3F9BFF,#0A72E8)}
.badge.b-fav{background:linear-gradient(180deg,var(--yel-a),var(--yel-b));color:#1C1C1E}
/* Текст прижат к низу плашки и занимает в ней ровно столько же места
   при любой игре: высота плашки задана, название — одна строка, подпись —
   две. Иначе экран под плашкой прыгал бы при каждом открытии, ведь игра
   в ней каждый раз другая. Справа внизу лежит кнопка — под неё оставлен
   отступ у подписи; название проходит выше неё и может быть шире. */
.hero-foot{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;gap:12px}
/* строка повода над названием: счёт, когда играли, сколько партий.
   Место под неё держится всегда, даже когда она пустая, — иначе
   название прыгало бы по высоте от повода к поводу. */
.hero-meta{
  display:block;min-height:15px;margin-bottom:2px;font-style:normal;
  font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hero-txt{flex:1;min-width:0}
/* Длинное название набирается мельче, но если всё равно не влезло —
   переносится на вторую строку, а не обрезается: высота плашки задана,
   и лишняя строка ничего не сдвинет. */
.hero h3{
  margin:0;font-size:24px;font-weight:700;letter-spacing:-.5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hero h3.mid{font-size:22px;letter-spacing:-.45px}
.hero h3.long{font-size:20px;letter-spacing:-.4px}
.hero p{
  margin:3px 0 0;font-size:14px;line-height:1.35;color:rgba(255,255,255,.66);
  letter-spacing:-.1px;min-height:4.05em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.play{
  flex:none;padding:10px 20px;border-radius:999px;background:#fff;color:var(--ink);
  font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;
}
/* ---------- живые картинки в плашке ---------- */
/* У каждой из девяти игр своя: плашка — витрина, и игра в ней должна
   двигаться. Всё на CSS, без картинок и скриптов.

   Два правила, которым подчиняются все девять:
   1. Имена классов с приставкой ha- — пространство имён в одностраничном
      файле общее, и короткие имена уже заняты.
   2. Кадр 0% и кадр 100% — это ПОЛНАЯ картинка, а не пустое поле. Тогда
      петля не дёргается на стыке, а при отключённой анимации (у человека
      в настройках телефона «уменьшить движение») в плашке остаётся
      законченный рисунок, а не пустота. */
.hero-art{position:absolute;right:16px;top:14px;width:150px;height:110px;transform-origin:top right}
.hero-art i,.hero-art b{position:absolute}

/* 4 в ряд: фишка падает в ряд и достраивает четвёрку */
.ha-4r .hole{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.09)}
.ha-4r .r1{top:70px}.ha-4r .r2{top:32px}
.ha-4r .disc{top:72px;width:28px;height:28px;border-radius:50%;
  background:linear-gradient(160deg,var(--red-a),var(--red-b));animation:ha-win 3.6s var(--ease) infinite}
.ha-4r .yel{top:34px;background:linear-gradient(160deg,var(--yel-a),var(--yel-b));animation:none}
.ha-4r .fall{animation:ha-fall 3.6s var(--ease) infinite}
@keyframes ha-fall{
  0%,26%{transform:translateY(0);opacity:1}
  27%{transform:translateY(-104px);opacity:0}
  33%{opacity:1}
  55%{transform:translateY(0)}
  61%{transform:translateY(-11px)}
  70%,100%{transform:translateY(0);opacity:1}
}
@keyframes ha-win{0%,70%{transform:scale(1)}78%{transform:scale(1.16)}88%,100%{transform:scale(1)}}

/* Матрёшка: фишки съезжаются в стопку — большая кроет меньшую, но не
   целиком, иначе стопка читается как одна фишка */
.ha-mt i{border-radius:50%;bottom:18px}
.ha-mt .s{left:8px;width:28px;height:28px;background:linear-gradient(160deg,var(--yel-a),var(--yel-b))}
.ha-mt .m{left:44px;width:44px;height:44px;background:linear-gradient(160deg,var(--red-a),var(--red-b));
  animation:ha-cover-m 3.6s var(--ease) infinite}
.ha-mt .l{left:92px;width:58px;height:58px;background:linear-gradient(160deg,var(--yel-a),var(--yel-b));
  animation:ha-cover-l 3.6s var(--ease) infinite}
@keyframes ha-cover-m{0%,18%{transform:translateX(0)}44%,66%{transform:translateX(-31px)}88%,100%{transform:translateX(0)}}
@keyframes ha-cover-l{0%,18%{transform:translateX(0)}44%,66%{transform:translateX(-41px)}88%,100%{transform:translateX(0)}}

/* Магнитный бой: шарики сходятся, слипаются и расходятся */
.ha-mg .ball{top:33px;width:44px;height:44px;border-radius:50%}
.ha-mg .a{left:14px;background:linear-gradient(160deg,var(--red-a),var(--red-b));
  animation:ha-mag-a 3.6s var(--ease) infinite}
.ha-mg .b{left:92px;background:linear-gradient(160deg,var(--yel-a),var(--yel-b));
  animation:ha-mag-b 3.6s var(--ease) infinite}
.ha-mg .ring{left:41px;top:22px;width:66px;height:66px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);animation:ha-ring 3.6s ease-out infinite}
@keyframes ha-mag-a{0%,18%{transform:translateX(0)}42%,66%{transform:translateX(17px)}90%,100%{transform:translateX(0)}}
@keyframes ha-mag-b{0%,18%{transform:translateX(0)}42%,66%{transform:translateX(-17px)}90%,100%{transform:translateX(0)}}
@keyframes ha-ring{0%,28%{transform:scale(.55);opacity:0}44%{transform:scale(1);opacity:.85}68%,100%{transform:scale(1.3);opacity:0}}

/* Мемо-дуэль: две карточки переворачиваются и показывают пару */
.ha-mm .card{top:16px;width:56px;height:78px;border-radius:13px;display:grid;place-items:center;
  background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3);animation:ha-flip 3.6s var(--ease) infinite}
.ha-mm .c1{left:10px}
.ha-mm .c2{left:84px;animation-delay:.3s}
.ha-mm .card b{position:static;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(160deg,var(--red-a),var(--red-b));animation:ha-sym 3.6s steps(1) infinite}
.ha-mm .c2 b{animation-delay:.3s}
@keyframes ha-flip{
  0%,16%{transform:rotateY(0);background:#fff}
  30%{transform:rotateY(90deg);background:#fff}
  31%{background:rgba(255,255,255,.16)}
  44%,58%{transform:rotateY(0);background:rgba(255,255,255,.16)}
  72%{transform:rotateY(90deg);background:rgba(255,255,255,.16)}
  73%{background:#fff}
  86%,100%{transform:rotateY(0);background:#fff}
}
@keyframes ha-sym{0%,30%{opacity:1}31%,72%{opacity:0}73%,100%{opacity:1}}

/* Точки и квадраты: линии обводят клетку, и она закрашивается */
.ha-dt .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.85)}
.ha-dt .ln{background:var(--yel-b);border-radius:3px}
.ha-dt .h{width:44px;height:6px;transform-origin:left center;animation:ha-lnh 3.6s var(--ease) infinite}
.ha-dt .v{width:6px;height:44px;transform-origin:center top;animation:ha-lnv 3.6s var(--ease) infinite}
.ha-dt .sq{width:38px;height:38px;border-radius:9px;
  background:linear-gradient(160deg,var(--red-a),var(--red-b));animation:ha-sq 3.6s var(--ease) infinite}
@keyframes ha-lnh{0%,18%{transform:scaleX(1)}26%,40%{transform:scaleX(0)}56%,100%{transform:scaleX(1)}}
@keyframes ha-lnv{0%,18%{transform:scaleY(1)}26%,40%{transform:scaleY(0)}56%,100%{transform:scaleY(1)}}
@keyframes ha-sq{
  0%,14%{opacity:1;transform:scale(1)}
  22%,62%{opacity:0;transform:scale(.35)}
  76%{opacity:1;transform:scale(1.1)}
  84%,100%{opacity:1;transform:scale(1)}
}

/* 5 букв: буквы переворачиваются и загораются зелёным */
.ha-5b .t{top:38px;width:26px;height:34px;border-radius:7px;display:grid;place-items:center;
  font:700 16px/1 -apple-system,system-ui,sans-serif;font-style:normal;color:#fff;
  background:linear-gradient(180deg,#4CD671,#30B855);
  animation:ha-tile 3.6s var(--ease) infinite}
@keyframes ha-tile{
  0%,14%{transform:rotateX(0);background:linear-gradient(180deg,#4CD671,#30B855)}
  28%{transform:rotateX(90deg);background:linear-gradient(180deg,#4CD671,#30B855)}
  29%{background:rgba(255,255,255,.16)}
  42%,58%{transform:rotateX(0);background:rgba(255,255,255,.16)}
  72%{transform:rotateX(90deg);background:rgba(255,255,255,.16)}
  73%{background:linear-gradient(180deg,#4CD671,#30B855)}
  86%,100%{transform:rotateX(0);background:linear-gradient(180deg,#4CD671,#30B855)}
}

/* Быстрая виселица: виселица покачивается, буквы встают в слова */
.ha-vs .post{left:4px;top:8px;width:9px;height:88px;border-radius:5px;background:var(--red-b)}
.ha-vs .beam{left:4px;top:8px;width:46px;height:9px;border-radius:5px;background:var(--red-b)}
.ha-vs .hang{left:32px;top:14px;width:36px;height:52px;transform-origin:14px 0;
  animation:ha-sway 3.6s ease-in-out infinite}
.ha-vs .hang .rope{left:11px;top:0;width:6px;height:16px;border-radius:3px;background:var(--yel-b)}
.ha-vs .hang .head{left:0;top:14px;width:28px;height:28px;border-radius:50%;border:6px solid var(--yel-b)}
.ha-vs .sl{bottom:12px;width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.ha-vs .lt{bottom:24px;width:26px;text-align:center;font:700 19px/1 -apple-system,system-ui,sans-serif;
  font-style:normal;color:#fff;animation:ha-letter 3.6s var(--ease) infinite}
@keyframes ha-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes ha-letter{
  0%,26%{transform:translateY(0);opacity:1}
  34%{transform:translateY(-9px);opacity:.25}
  46%,100%{transform:translateY(0);opacity:1}
}

/* Захлопни ящик: кубик катится, цифры захлопываются */
.hero-art .die{
  left:50%;top:0;width:44px;height:44px;margin-left:-22px;border-radius:11px;
  background:linear-gradient(160deg,#fff,#DDDDE3);box-shadow:0 6px 14px rgba(0,0,0,.35);
  animation:roll 3.6s var(--spring) infinite;
}
.hero-art .die b{width:8px;height:8px;border-radius:50%;background:var(--red-b)}
.hero-art .die b:nth-child(1){left:9px;top:9px}
.hero-art .die b:nth-child(2){left:18px;top:18px}
.hero-art .die b:nth-child(3){left:27px;top:27px}
@keyframes roll{0%{transform:rotate(0) scale(1)}14%{transform:rotate(200deg) scale(.86)}28%,100%{transform:rotate(360deg) scale(1)}}
.hero-art .tl{
  bottom:0;left:var(--x);width:26px;height:26px;border-radius:7px;
  display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:var(--ink);
  background-color:var(--yel-b);
  animation:shut 3.6s var(--ease) var(--d) infinite;
}
@keyframes shut{
  0%,30%{transform:rotateX(0);background-color:var(--yel-b);color:var(--ink)}
  44%{transform:rotateX(90deg);background-color:var(--yel-b);color:var(--ink)}
  45%{background-color:rgba(255,255,255,.14);color:transparent}
  58%,86%{transform:rotateX(0);background-color:rgba(255,255,255,.14);color:transparent}
  95%,100%{transform:rotateX(0);background-color:var(--yel-b);color:var(--ink)}
}
/* Доббль: две карты рядом, общий символ вспыхивает на обеих сразу */
.ha-db .cd{width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.34)}
.ha-db .cd.a{left:0;top:6px;animation:dbfloat 5.4s ease-in-out infinite}
.ha-db .cd.b{left:76px;top:30px;animation:dbfloat 5.4s ease-in-out .5s infinite}
.ha-db b{border-radius:50%}
.ha-db .p1{left:11px;top:13px;width:13px;height:13px;background:var(--yel-b)}
.ha-db .p2{left:47px;top:47px;width:11px;height:11px;background:#1C1C1E;opacity:.22}
.ha-db .hit{left:24px;top:38px;width:17px;height:17px;background:var(--red-b);
  animation:dbhit 3.6s var(--spring) infinite}
.ha-db .cd.b .p1{left:47px;top:45px}
.ha-db .cd.b .p2{left:13px;top:15px}
.ha-db .cd.b .hit{left:34px;top:16px}
@keyframes dbfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dbhit{0%,52%,100%{transform:scale(1)}66%{transform:scale(1.5)}80%{transform:scale(1.18)}}

/* Взломщик кода: диски велозамка прокручиваются, код сходится — и трос
   выскакивает из корпуса. В кадрах 0% и 100% замок заперт на том же коде. */
.ha-vz .sh{left:14px;top:4px;width:122px;height:58px;border:10px solid #56565C;border-bottom:0;
  border-radius:60px 60px 0 0;transform-origin:5px 100%;animation:ha-vz-open 3.6s var(--spring) infinite}
.ha-vz .bd{left:0;top:58px;width:150px;height:42px;border-radius:21px;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%,rgba(0,0,0,.22)),linear-gradient(180deg,var(--red-a),var(--red-b));
  box-shadow:0 10px 18px -8px rgba(0,0,0,.6)}
.ha-vz .wl{top:52px;width:24px;height:54px;border-radius:6px;overflow:hidden;background:#141416;
  box-shadow:0 3px 8px rgba(0,0,0,.4)}
.ha-vz .wl b{left:0;right:0;top:-6px;display:block;white-space:pre;text-align:center;
  font:700 15px/22px -apple-system,system-ui,sans-serif;color:#F4F4F6;
  animation:ha-vz-roll 3.6s var(--ease) infinite}
.ha-vz .wl u{position:absolute;inset:0;text-decoration:none;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.85))}
@keyframes ha-vz-roll{0%,10%{transform:translateY(0)}30%,42%{transform:translateY(-44px)}60%,100%{transform:translateY(0)}}
/* трос поворачивается вокруг левого конца, правый выходит из втулки */
.ha-vz .fr{top:50px;width:16px;height:9px;border-radius:1.5px;
  background:linear-gradient(90deg,#77777D,#E4E4E8 45%,#8A8A90)}
@keyframes ha-vz-open{0%,62%{transform:none}70%,86%{transform:rotate(-10deg)}96%,100%{transform:none}}

/* Рисунок для игр без собственной анимации в плашке. Поле квадратное:
   плиточная графика нарисована в квадрате, и в прямоугольнике она вылезала. */
.hero-generic{position:absolute;right:20px;top:12px;width:112px;height:112px;display:grid;place-items:center}
.hero-generic svg{width:100%;height:100%;animation:float 6.4s ease-in-out infinite}

/* ---------- продолжить ---------- */
.cont{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;
  background:var(--surface);border-radius:14px;padding:8px 14px 8px 8px;box-shadow:var(--card-shadow);
  transition:transform .16s var(--spring);
}
.chip:active{transform:scale(.95)}
.chip svg{width:34px;height:34px;border-radius:9px;flex:none}
.chip b{display:block;font-size:14px;font-weight:600;letter-spacing:-.2px}
.chip i{display:block;font-style:normal;font-size:11.5px;color:var(--label3);margin-top:1px}

/* ---------- бенто ---------- */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:620px){.bento{grid-template-columns:repeat(4,1fr)}}
.t{
  position:relative;display:block;overflow:hidden;text-decoration:none;
  border-radius:20px;aspect-ratio:1;box-shadow:var(--card-shadow);
  transition:transform .16s var(--spring);
  animation:rise .4s var(--ease) both;
}
.t:nth-child(1){animation-delay:.03s}.t:nth-child(2){animation-delay:.07s}
.t:nth-child(3){animation-delay:.11s}.t:nth-child(4){animation-delay:.15s}
.t:nth-child(5){animation-delay:.19s}.t:nth-child(6){animation-delay:.23s}
.t:nth-child(7){animation-delay:.27s}.t:nth-child(8){animation-delay:.31s}
.t:nth-child(9){animation-delay:.35s}.t:nth-child(10){animation-delay:.39s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.t:active{transform:scale(.96)}
.t.wide{grid-column:span 2;aspect-ratio:2.15/1}
.t.red{background:linear-gradient(150deg,var(--red-a),var(--red-b))}
.t.yel{background:linear-gradient(150deg,var(--yel-a),var(--yel-b))}
.t.dark{background:radial-gradient(120% 130% at 78% 16%,#3A3A3F 0,#1C1C1E 64%)}
.t::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.42));
}
.t.yel::after{background:linear-gradient(180deg,transparent,rgba(255,255,255,.5))}
.t .cap{position:absolute;left:14px;right:12px;bottom:12px;z-index:2}
.t .cap b{display:block;font-size:15px;font-weight:700;letter-spacing:-.25px;line-height:1.15;color:#fff}
.t .cap i{display:block;font-style:normal;font-size:11.5px;line-height:1.25;margin-top:3px;color:rgba(255,255,255,.72)}
.t.yel .cap b{color:var(--ink)}
.t.yel .cap i{color:rgba(28,28,30,.66)}
.t .art{position:absolute;inset:0;z-index:1}
.t .art svg{position:absolute;overflow:visible}

/* мотивы в плитках */
.art-connect svg{right:-6%;top:12%;width:74%;height:auto;animation:floatr 7s ease-in-out infinite}
.art-magnet svg{left:50%;top:26%;width:62%;transform:translateX(-50%);animation:float 6s ease-in-out infinite}
.art-memo svg{left:50%;top:18%;width:52%;transform:translateX(-50%);animation:swing 5.5s ease-in-out infinite}
.art-gobble svg{left:50%;top:16%;width:60%;transform:translateX(-50%);animation:float 6.5s ease-in-out infinite}
.art-dots svg{left:50%;top:11%;width:50%;transform:translateX(-50%);animation:swing 7s ease-in-out infinite}
.art-word svg{left:50%;top:26%;width:74%;transform:translateX(-50%);animation:float 6.2s ease-in-out infinite}
.art-hang svg{left:50%;top:15%;width:50%;transform:translateX(-50%);animation:float 7.4s ease-in-out infinite}
.art-box svg{left:50%;top:16%;width:62%;transform:translateX(-50%);animation:float 6.8s ease-in-out infinite}
.art-spot svg{left:50%;top:20%;width:72%;transform:translateX(-50%);animation:swing 6.6s ease-in-out infinite}
.art-lock svg{left:50%;top:13%;width:72%;transform:translateX(-50%);animation:swing 6.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-7px)}}
@keyframes swing{0%,100%{transform:translate(-50%,0) rotate(-4deg)}50%{transform:translate(-50%,-5px) rotate(4deg)}}
@keyframes floatr{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(-2deg)}}

/* плитка «скоро» */
.t.soon{
  background:var(--fill2);border:2px dashed var(--label3);box-shadow:none;
  display:grid;place-items:center;
}
.t.soon::after{display:none}
.t.soon .lbl{text-align:center}
.t.soon .lbl b{display:block;font-size:15px;font-weight:700;color:var(--label2);letter-spacing:-.25px}
.t.soon .lbl i{display:block;font-style:normal;font-size:12px;color:var(--label3);margin-top:2px}
.t.soon .dts{display:flex;gap:6px;justify-content:center;margin-bottom:9px}
.t.soon .dts u{width:7px;height:7px;border-radius:50%;background:var(--label3);text-decoration:none;animation:blink 1.4s ease infinite}
.t.soon .dts u:nth-child(2){animation-delay:.18s}
.t.soon .dts u:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,70%,100%{opacity:.3;transform:scale(1)}35%{opacity:.9;transform:scale(1.3)}}

.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .3s ease;z-index:9;
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:10;

.srow{position:relative;display:flex;align-items:center;gap:11px;padding:11px 14px}
.srow+.srow::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.srow svg{width:30px;height:30px;border-radius:8px;flex:none}
.srow .n{flex:1;min-width:0}
.srow .n b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.srow .n i{display:block;font-style:normal;font-size:12px;color:var(--label2);margin-top:1px}
.srow .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label2);letter-spacing:-.2px}
.empty{padding:26px 16px;text-align:center;color:var(--label2);font-size:14.5px;line-height:1.45}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:14px;cursor:pointer;
  font:inherit;font-size:17px;font-weight:600;letter-spacing:-.3px;

.nlab{display:block;margin:0 4px 6px;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.nin{
  display:block;width:100%;margin:0 0 14px;padding:13px 15px;border:0;border-radius:14px;
  background:var(--surface);color:var(--label);box-shadow:var(--card-shadow);

.legal{margin:24px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}

/* планшет и шире — герой крупнее */

}

<script>
(function(){
'use strict';

/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит во всех играх серии. Всё в try/catch: если хранилище
   недоступно, приложение работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g; write(d);
  }
  function clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();

     В каждом диске столбик из пяти цифр: в покое видна вторая, в середине

  'vzlomshik':'<div class="hero-art ha-vz" aria-hidden="true">'+
    '<i class="sh"></i><i class="bd"></i><i class="fr" style="left:11px"></i><i class="fr" style="left:123px"></i>'+
    cols(4,function(x,i){
      var col=['9\n2\n7\n0\n1','5\n6\n1\n8\n3','3\n0\n4\n5\n9','8\n4\n2\n9\n6'][i];
      return '<i class="wl" style="left:'+(21+x)+'px"><b style="animation-delay:'+(i*0.12)+'s">'+col+'</b><u></u></i>';
    },28)+
  '</div>',

  /* Быстрая виселица: виселица покачивается, буквы встают на места */
  'viselica':'<div class="hero-art ha-vs" aria-hidden="true">'+
    '<i class="post"></i><i class="beam"></i>'+
    '<i class="hang"><i class="rope"></i><i class="head"></i></i>'+
    cols(3,function(x,i){ return '<i class="sl" style="left:'+(70+x)+'px"></i>'+
                                 '<i class="lt" style="left:'+(70+x)+'px;animation-delay:'+(i*0.13)+'s">'+
                                 'КОТ'.charAt(i)+'</i>'; },28)+
  '</div>',

  /* Захлопни ящик: кубик катится, цифры захлопываются */
  'zahlopni-yaschik':'<div class="hero-art" aria-hidden="true">'+
    '<i class="die"><b></b><b></b><b></b></i>'+
    '<i class="tl" style="--x:0px;--d:0s">1</i>'+
    '<i class="tl" style="--x:31px;--d:.2s">2</i>'+
    '<i class="tl" style="--x:62px;--d:.4s">3</i>'+
    '<i class="tl" style="--x:93px;--d:.6s">4</i>'+
    '<i class="tl" style="--x:124px;--d:.8s">5</i>'+
  '</div>'
};

/* повторяющиеся элементы картинки: столбцы, клетки, буквы */
function cols(n, tpl, step){
  var out='', i;
  for(i=0;i<n;i++) out+=tpl(i*(step||38), i);
  return out;
}
function byId(id){ for(var i=0;i<GAMES.length;i++) if(GAMES[i].id===id) return GAMES[i]; return null; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ago(ts){
  if(!ts) return '';
  var d=Math.floor((Date.now()-ts)/86400000);
  if(d<=0) return 'сегодня';
  if(d===1) return 'вчера';
  if(d<7)  return d+' дн. назад';
  if(d<30) return Math.floor(d/7)+' нед. назад';
  return 'давно';
}

/* ---------- герой ---------- */
/* Большая плашка не закреплена за одной игрой: поводов показать её три.
   «Новое» — игра, которую мы выделяем сами; «Продолжить» — та, в которую
   играли последней; «Любимая» — та, в которую сыграли больше всего партий.
   При каждом открытии показывается СЛЕДУЮЩИЙ по кругу повод из тех, что
   сейчас есть. У нового игрока истории нет, и остаётся одно «Новое» —
   экран от этого не становится пустее, просто не меняется. */
var HERO_ID='';                     /* какая игра сейчас в плашке */

function heroPicks(){
  var hist=recentList(99), cont=hist[0]||null, fav=null, picks=[], i, s;
  /* любимая — где партий больше всего, но не меньше трёх: на одной-двух
     партиях называть игру любимой ещё рано */
  for(i=0;i<hist.length;i++){
    if((hist[i].s.plays||0)<3) continue;
    if(!fav || (hist[i].s.plays||0)>(fav.s.plays||0)) fav=hist[i];
  }
  if(fav && cont && fav.g.id===cont.g.id) fav=null;      /* это одна и та же игра */

  var fresh=byId(FEATURED);
  if(fresh && (!fresh.ready || (cont && cont.g.id===fresh.id))) fresh=null;

  /* Описание игры показываем всегда — плашка прежде всего рассказывает,
     что это за игра. Повод (счёт, сколько партий) идёт отдельной строкой
     над названием и не съедает описание. */
  if(fresh) picks.push({key:'new', label:FEATURED_LABEL, g:fresh, cta:'Играть', meta:''});
  if(cont){
    s=cont.s;
    picks.push({key:'cont', label:'Продолжить', g:cont.g, cta:'Продолжить',
                meta:(s.note||'')+(s.note?' · ':'')+ago(s.last)});
  }
  if(fav){
    s=fav.s;
    picks.push({key:'fav', label:'Любимая', g:fav.g, cta:'Играть',
                meta:'Сыграно '+s.plays+' '+plural(s.plays,'партия','партии','партий')});
  }
  return picks;
}

/* чем длиннее название, тем мельче кегль — чтобы влезало в одну строку */
function heroSize(t){
  if(t.length>14) return ' class="long"';
  if(t.length>11) return ' class="mid"';
  return '';
}
function renderHero(){
  var picks=heroPicks(), was=DP.hero(), at=0, i;
  if(!picks.length) return;
  for(i=0;i<picks.length;i++) if(picks[i].key===was) at=i+1;   /* следующий по кругу */
  var p=picks[at%picks.length];
  DP.hero(p.key);
  HERO_ID=p.g.id;
  var art=HERO_ART[p.g.id] || '<div class="hero-generic" aria-hidden="true">'+(TILE_ART[p.g.art]||'')+'</div>';
  document.getElementById('hero').innerHTML=
    '<a class="hero" href="'+esc(p.g.href)+'">'+
      '<span class="badge b-'+p.key+'">'+esc(p.label)+'</span>'+
      art+
      '<span class="hero-foot">'+
        '<span class="hero-txt">'+
          '<i class="hero-meta">'+esc(p.meta||'')+'</i>'+
          '<h3'+heroSize(p.g.title)+'>'+esc(p.g.title)+'</h3>'+
          '<p>'+esc(p.g.full)+'</p>'+
        '</span>'+
        '<span class="play">'+esc(p.cta)+'</span>'+
      '</span>'+
    '</a>';
}

/* ---------- продолжить / с чего начать ---------- */
function recentList(n){
  var games=DP.read().games, out=[], id;
  for(id in games){
    if(!Object.prototype.hasOwnProperty.call(games,id)) continue;
    var g=byId(id); if(!g||!g.ready) continue;
    out.push({g:g,s:games[id]});
  }
  out.sort(function(a,b){ return (b.s.last||0)-(a.s.last||0); });
  return out.slice(0, n || 4);
}
function chip(g,note){
  return '<a class="chip" href="'+esc(g.href)+'">'+
           '<svg viewBox="0 0 64 64" aria-hidden="true">'+ICON[g.id]+'</svg>'+
           '<span><b>'+esc(g.title)+'</b><i>'+esc(note)+'</i></span>'+
         '</a>';
}
function renderRecent(){
  var head=document.getElementById('contHead'), box=document.getElementById('cont');
  /* игру из большой плашки в строке не повторяем — она уже на экране */
  var list=recentList(5).filter(function(it){ return it.g.id!==HERO_ID; }).slice(0,4);
  var html='', i;
  if(list.length){
    document.getElementById('contTitle').textContent='Продолжить';
    document.getElementById('contNote').textContent=ago(list[0].s.last);
    for(i=0;i<list.length;i++) html+=chip(list[i].g, list[i].s.note || (list[i].s.plays+' парт.'));
  }else{
    /* истории ещё нет — предлагаем, с чего начать */
    document.getElementById('contTitle').textContent='С чего начать';
    document.getElementById('contNote').textContent='';
    for(i=0;i<SUGGEST.length;i++){
      var g=byId(SUGGEST[i]); if(g&&g.ready) html+=chip(g,g.desc);
    }
  }
  if(!html) return;
  box.innerHTML=html; head.hidden=false; box.hidden=false;
}

/* ---------- сетка ---------- */
function renderBento(){
  var html='', ready=0, total=GAMES.length, i, g;
  for(i=0;i<GAMES.length;i++) if(GAMES[i].ready) ready++;
  for(i=0;i<GAMES.length;i++){
    g=GAMES[i];
    if(g.id===HERO_ID) continue;              /* эта игра уже показана в плашке */
    if(!g.ready){
      html+='<div class="t soon" aria-disabled="true">'+
              '<span class="lbl">'+
                '<span class="dts" aria-hidden="true"><u></u><u></u><u></u></span>'+
                '<b>'+esc(g.title)+'</b><i>'+esc(g.desc)+'</i>'+
              '</span>'+
            '</div>';
      continue;
    }
    html+='<a class="t '+g.tone+(g.wide?' wide':'')+'" href="'+esc(g.href)+'">'+
            '<span class="art art-'+g.art+'" aria-hidden="true">'+(TILE_ART[g.art]||'')+'</span>'+
            '<span class="cap"><b>'+esc(g.title)+'</b><i>'+esc(g.desc)+'</i></span>'+
          '</a>';
  }
  document.getElementById('bento').innerHTML=html;
  document.getElementById('count').textContent = ready===total ? 'Все десять' : ready+' из '+total;
}

/* ---------- статистика ---------- */
var sheetEl=document.getElementById('sheet');
var backdrop=document.getElementById('backdrop');
var resetBtn=document.getElementById('statReset');
var resetArmed=false;

function renderStats(){
  var games=DP.read().games, html='', total=0, i, g, s;
  for(i=0;i<GAMES.length;i++){
    g=GAMES[i]; if(!g.ready) continue;
    s=games[g.id];
    if(!s) continue;
    total+=s.plays||0;
    /* вдвоём показываем счёт красные : жёлтые, в одиночной игре — сколько отгадано */
    var duel=(s.w1||0)+(s.w2||0)+(s.draws||0);
    var score=duel ? ((s.w1||0)+' : '+(s.w2||0))
                   : (s.solved ? (s.solved+' / '+(s.plays||0)) : '—');
    var sub=(s.plays||0)+' '+plural(s.plays||0,'партия','партии','партий');
    if(duel&&s.draws) sub+=' · ничьих '+s.draws;
    if(s.solved) sub+=' · угадано '+s.solved;
    sub+=' · '+ago(s.last);
    html+='<div class="srow">'+
            '<svg viewBox="0 0 64 64" aria-hidden="true">'+ICON[g.id]+'</svg>'+
            '<span class="n"><b>'+esc(g.title)+'</b><i>'+esc(sub)+'</i></span>'+
            '<span class="v">'+score+'</span>'+
          '</div>';
  }
  document.getElementById('statBody').innerHTML = html
    ? '<div class="slist">'+html+'</div>'
    : '<div class="slist"><p class="empty">Пока пусто.<br>Сыграйте партию — здесь появится счёт по каждой игре.</p></div>';
  document.getElementById('statSub').textContent = total
    ? ('Всего партий: '+total+' · красные : жёлтые')
    : 'История партий хранится только на этом устройстве';
  resetBtn.hidden=!total;
  resetBtn.textContent='Сбросить статистику';
  resetArmed=false;
}
function plural(n,a,b,c){
  var n10=n%10, n100=n%100;
  if(n10===1&&n100!==11) return a;
  if(n10>=2&&n10<=4&&(n100<10||n100>=20)) return b;
  return c;
}
function openStats(){ renderStats(); backdrop.classList.add('on'); sheetEl.classList.add('on'); }
function closeStats(){ backdrop.classList.remove('on'); sheetEl.classList.remove('on'); }

/* ---------- имена игроков ---------- */
/* Одно место на всё приложение: игры читают имена из общей памяти. */
var whoSheet=document.getElementById('whoSheet');
var meEl=document.getElementById('nameMe'), friendEl=document.getElementById('nameFriend');
function saveWho(){ DP.names({me:meEl.value, friend:friendEl.value}); }
function openWho(){
  var p=DP.names();
  meEl.value=p.me; friendEl.value=p.friend;
  backdrop.classList.add('on'); whoSheet.classList.add('on');
}
function closeWho(){
  saveWho();
  try{ meEl.blur(); friendEl.blur(); }catch(e){}
  backdrop.classList.remove('on'); whoSheet.classList.remove('on');
  renderRecent();
}
meEl.addEventListener('input',saveWho);
friendEl.addEventListener('input',saveWho);
[meEl,friendEl].forEach(function(el){
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
});
document.getElementById('whoBtn').addEventListener('click',openWho);
document.getElementById('whoClose').addEventListener('click',closeWho);

/* строка для скринридера — та же, что во всех играх */
function announce(t){
  var el=document.getElementById('live');
  if(el) el.textContent=t;
}

/* ---------- переключатель звука ---------- */
var sndBtn=document.getElementById('sndBtn');
var SND_ON="<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5L6.5 9H3v6h3.5L11 19z'/><path d='M15.5 8.8a4.5 4.5 0 0 1 0 6.4'/><path d='M18.5 6a8 8 0 0 1 0 12'/></svg>";
var SND_OFF="<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5L6.5 9H3v6h3.5L11 19z'/><path d='M16 10l5 5M21 10l-5 5'/></svg>";
function paintSound(){
  var on=DP.sound();
  sndBtn.innerHTML = on ? SND_ON : SND_OFF;
  sndBtn.classList.toggle('off',!on);
  sndBtn.setAttribute('aria-pressed',on?'true':'false');
  sndBtn.setAttribute('aria-label',on?'Звук включён':'Звук выключен');
}
sndBtn.addEventListener('click',function(){
  var on=DP.sound(!DP.sound());
  FX.forget(); paintSound();
  announce(on?'Звук включён':'Звук выключен');
  if(on) FX.play('good');           /* включили — коротко подтверждаем на слух */
});
paintSound();

/* ---------- переключатель темы ---------- */
/* Кнопка показывает тему, которая сейчас на экране: солнце — светлая,
   месяц — тёмная. Пока игрок её не трогал, тема берётся из настроек
   телефона и меняется вместе с ними; первое же нажатие фиксирует выбор. */
var themeBtn=document.getElementById('themeBtn');
var T_SUN="<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='4.1'/>"+
  "<path d='M12 2.6V5M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4'/></svg>";
var T_MOON="<svg viewBox='0 0 24 24' aria-hidden='true'>"+
  "<path d='M20.3 14.6A8.6 8.6 0 0 1 9.4 3.7 8.6 8.6 0 1 0 20.3 14.6z'/></svg>";
function paintTheme(){
  var night=DP.dark();
  themeBtn.innerHTML = night ? T_MOON : T_SUN;
  themeBtn.setAttribute('aria-label', night ? 'Тёмная тема, включить светлую'
                                            : 'Светлая тема, включить тёмную');
}
themeBtn.addEventListener('click',function(){
  var night=DP.dark();
  DP.theme(night?'light':'dark');
  paintTheme();
  announce(night?'Светлая тема':'Тёмная тема');
});
paintTheme();
/* внутри Telegram тему может поставить он сам — кнопка должна это отразить */
document.addEventListener('dp:telegram', paintTheme);
/* своего выбора ещё нет — идём за настройками телефона, если их поменяли */
try{
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
    if(!DP.theme()) paintTheme();
  });
}catch(e){}

document.getElementById('statBtn').addEventListener('click',openStats);
document.getElementById('statClose').addEventListener('click',closeStats);
backdrop.addEventListener('click',function(){
  if(whoSheet.classList.contains('on')) closeWho(); else closeStats();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeStats(); });
resetBtn.addEventListener('click',function(){
  if(!resetArmed){ resetArmed=true; resetBtn.textContent='Точно сбросить?'; return; }
  DP.clear(); renderStats(); renderRecent();
});

renderHero();
renderRecent();
renderBento();
})();
</script>
</body>
